# Reusable Lark Webhook Notification — Composite Action
# Replaces duplicated 30+ line curl blocks across all workflows
# Uses HMAC-SHA256 signed interactive card messages
name: 'Lark Notify'
description: 'Send interactive card notification to Lark webhook'

inputs:
  webhook-url:
    description: 'Lark webhook URL'
    required: true
  sign-key:
    description: 'HMAC-SHA256 signing key'
    required: true
  title:
    description: 'Card header title'
    required: true
  template:
    description: 'Card color: green, red, blue, yellow, purple'
    required: true
    default: 'blue'
  content:
    description: 'Card body in lark_md format'
    required: true
  button-text:
    description: 'Action button label'
    required: false
    default: ''
  button-url:
    description: 'Action button URL'
    required: false
    default: ''
  button-type:
    description: 'Button style: primary or danger'
    required: false
    default: 'primary'

runs:
  using: 'composite'
  steps:
    - name: Send Lark notification
      shell: bash
      env:
        LARK_WEBHOOK: ${{ inputs.webhook-url }}
        LARK_SIGN_KEY: ${{ inputs.sign-key }}
        CARD_TITLE: ${{ inputs.title }}
        CARD_TEMPLATE: ${{ inputs.template }}
        CARD_CONTENT: ${{ inputs.content }}
        BTN_TEXT: ${{ inputs.button-text }}
        BTN_URL: ${{ inputs.button-url }}
        BTN_TYPE: ${{ inputs.button-type }}
      run: |
        # Skip if webhook URL is empty
        if [ -z "$LARK_WEBHOOK" ]; then
          echo "::warning::Lark webhook URL not configured, skipping notification"
          exit 0
        fi

        # Generate HMAC-SHA256 signature (matching existing ci.yml pattern)
        TIMESTAMP=$(date +%s)
        SIGN=$(echo -n "" | openssl dgst -sha256 -hmac "$(printf '%s\n%s' "$TIMESTAMP" "$LARK_SIGN_KEY")" -binary | base64 2>/dev/null || echo "")

        # Build action button JSON (optional)
        BUTTON_JSON=""
        if [ -n "$BTN_TEXT" ] && [ -n "$BTN_URL" ]; then
          BUTTON_JSON=',{"tag": "action", "actions": [{"tag": "button", "text": {"tag": "plain_text", "content": "'"$BTN_TEXT"'"}, "url": "'"$BTN_URL"'", "type": "'"$BTN_TYPE"'"}]}'
        fi

        # Escape content for JSON (newlines, quotes, backslashes)
        ESCAPED_CONTENT=$(echo "$CARD_CONTENT" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        ESCAPED_TITLE=$(echo "$CARD_TITLE" | sed 's/"/\\"/g')

        # Send interactive card
        curl -s -X POST "$LARK_WEBHOOK" \
          -H 'Content-Type: application/json' \
          -d '{
            "timestamp": "'"$TIMESTAMP"'",
            "sign": "'"$SIGN"'",
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": {"tag": "plain_text", "content": "'"$ESCAPED_TITLE"'"},
                "template": "'"$CARD_TEMPLATE"'"
              },
              "elements": [
                {"tag": "div", "text": {"tag": "lark_md", "content": "'"$ESCAPED_CONTENT"'"}}
                '"$BUTTON_JSON"'
              ]
            }
          }' || true

        echo "Lark notification sent: $CARD_TITLE"
