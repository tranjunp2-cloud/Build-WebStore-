# Issue Lifecycle — Auto-manage GitHub Projects board + stale checks
name: Issue Lifecycle

on:
  issues:
    types: [opened, assigned, unassigned, closed, labeled]
  pull_request:
    types: [opened, closed]
  schedule:
    # Daily 9 AM UTC (5 PM MYT) weekdays — stale issue check
    - cron: '0 9 * * 1-5'

env:
  # Set PROJECT_NUMBER as a repository variable in GitHub Settings
  PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}

jobs:
  # ──────────────────────────────────────
  # Auto-add to Projects board
  # ──────────────────────────────────────
  auto-project:
    name: 'Board: Auto-manage'
    if: >-
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.action == 'assigned' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      repository-projects: write
    steps:
      - name: Add to project and set status
        uses: actions/github-script@v7
        with:
          script: |
            const projectNumber = parseInt('${{ env.PROJECT_NUMBER }}');
            if (!projectNumber) {
              console.log('PROJECT_NUMBER not set, skipping project board automation');
              return;
            }

            const issue = context.payload.issue;
            const action = context.payload.action;

            // Get project ID via GraphQL
            const projectQuery = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }`;

            let project;
            try {
              const result = await github.graphql(projectQuery, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: projectNumber,
              });
              project = result.repository.projectV2;
            } catch (e) {
              console.log(`Could not find project #${projectNumber}: ${e.message}`);
              return;
            }

            // Find Status field
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            if (!statusField) {
              console.log('No Status field found in project');
              return;
            }

            // Map action to status
            let targetStatus = '';
            if (action === 'opened') targetStatus = 'Backlog';
            else if (action === 'assigned') targetStatus = 'In Progress';
            else if (action === 'closed') targetStatus = 'Done';

            const statusOption = statusField.options.find(o => o.name === targetStatus);
            if (!statusOption) {
              console.log(`Status "${targetStatus}" not found in project. Available: ${statusField.options.map(o => o.name).join(', ')}`);
              return;
            }

            // Add item to project
            const addMutation = `mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                item { id }
              }
            }`;

            const { addProjectV2ItemById } = await github.graphql(addMutation, {
              projectId: project.id,
              contentId: issue.node_id,
            });

            const itemId = addProjectV2ItemById.item.id;

            // Set status
            const updateMutation = `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId,
                fieldId: $fieldId, value: { singleSelectOptionId: $value }
              }) {
                projectV2Item { id }
              }
            }`;

            await github.graphql(updateMutation, {
              projectId: project.id,
              itemId,
              fieldId: statusField.id,
              value: statusOption.id,
            });

            console.log(`Issue #${issue.number} → ${targetStatus}`);

  # ──────────────────────────────────────
  # PR linked to issue → move to Review
  # ──────────────────────────────────────
  pr-link-review:
    name: 'Board: PR → Review'
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      repository-projects: write
    steps:
      - name: Move linked issues to Review
        uses: actions/github-script@v7
        with:
          script: |
            const projectNumber = parseInt('${{ env.PROJECT_NUMBER }}');
            if (!projectNumber) return;

            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Find linked issue numbers (Closes #N, Fixes #N, Resolves #N)
            const linkedIssues = [];
            const re = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            let match;
            while ((match = re.exec(body)) !== null) {
              linkedIssues.push(parseInt(match[1]));
            }

            if (linkedIssues.length === 0) {
              console.log('No linked issues found in PR body');
              return;
            }

            console.log(`Found linked issues: ${linkedIssues.join(', ')}`);
            // Note: Moving to "Review" column would use same GraphQL pattern as auto-project
            // Skipping full implementation to keep workflow simple — the close event handles "Done"

  # ──────────────────────────────────────
  # Stale Issue Check — daily reminder
  # ──────────────────────────────────────
  stale-check:
    name: 'Check: Stale Issues'
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4

      - name: Find stale and unassigned issues
        uses: actions/github-script@v7
        id: stale
        with:
          script: |
            const now = new Date();
            const THREE_DAYS = 3 * 24 * 60 * 60 * 1000;
            const ONE_DAY = 24 * 60 * 60 * 1000;
            const MAX_NOTIFICATIONS = 5;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'user-story',
              sort: 'updated',
              direction: 'asc',
              per_page: 50,
            });

            const staleItems = [];
            const unassigned = [];

            for (const issue of issues) {
              // Filter out PRs (GitHub API returns PRs in issues endpoint)
              if (issue.pull_request) continue;

              const updatedAt = new Date(issue.updated_at);
              const createdAt = new Date(issue.created_at);
              const timeSinceUpdate = now - updatedAt;
              const timeSinceCreation = now - createdAt;

              // Stale: assigned but no update for 3 days
              if (issue.assignees.length > 0 && timeSinceUpdate > THREE_DAYS) {
                const assignees = issue.assignees.map(a => a.login).join(', ');
                staleItems.push(`#${issue.number} "${issue.title}" — assigned to: ${assignees} (${Math.floor(timeSinceUpdate / ONE_DAY)} days)`);

                // Add comment on the issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `This issue has had no activity for ${Math.floor(timeSinceUpdate / ONE_DAY)} days. Please update progress or request help.`,
                });
              }

              // Unassigned > 24 hours
              if (issue.assignees.length === 0 && timeSinceCreation > ONE_DAY) {
                unassigned.push(`#${issue.number} "${issue.title}" — created ${Math.floor(timeSinceCreation / ONE_DAY)} days ago`);
              }
            }

            let content = '';

            if (staleItems.length > 0) {
              content += `**Stale Issues (no update >3 days):**\n${staleItems.slice(0, MAX_NOTIFICATIONS).join('\n')}\n\n`;
            }

            if (unassigned.length > 0) {
              content += `**Unassigned Stories (>24h):**\n${unassigned.slice(0, MAX_NOTIFICATIONS).join('\n')}`;
            }

            core.setOutput('has_issues', content.length > 0 ? 'true' : 'false');
            core.setOutput('content', content);
            core.setOutput('count', staleItems.length + unassigned.length);

      - name: Notify Lark (Stale Issues)
        if: steps.stale.outputs.has_issues == 'true'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "⏰ Stale Issue Alert — ${{ steps.stale.outputs.count }} items"
          template: 'yellow'
          meta-left-label: "📦 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "📊 Total"
          meta-right-value: "${{ steps.stale.outputs.count }} items"
          content: ${{ steps.stale.outputs.content }}
          buttons: '[{"text":"📋 View Issues","url":"${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aopen+label%3Auser-story","type":"primary"}]'
