name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      final_message: ${{ steps.run_codex.outputs['final-message'] }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Generate PR diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- . ':!package-lock.json' ':!*.lock' > pr-diff.txt
          echo "Diff size: $(wc -l < pr-diff.txt) lines"
          head -20 pr-diff.txt

      - name: Run Codex Review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write

  post-review:
    runs-on: ubuntu-latest
    needs: codex-review
    if: needs.codex-review.outputs.final_message != ''
    permissions:
      pull-requests: write
    steps:
      - name: Post review
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const raw = process.env.CODEX_FINAL_MESSAGE || '';
            const pr = context.payload.pull_request;
            const commitId = pr.head.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Try to parse JSON
            let issues = [];
            try {
              const jsonMatch = raw.match(/\{[\s\S]*"issues"[\s\S]*\}/);
              if (jsonMatch) {
                issues = JSON.parse(jsonMatch[0]).issues || [];
              }
            } catch (e) {
              console.log('JSON parse failed:', e.message);
            }

            // No issues
            if (issues.length === 0) {
              if (raw.trim() && !raw.includes('"issues":[]')) {
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: pr.number,
                  body: `### 🤖 Codex Review (API)\n\n${raw}\n\n---\n_Powered by OpenAI Codex API_`,
                });
              } else {
                await github.rest.reactions.createForIssue({
                  owner, repo,
                  issue_number: pr.number,
                  content: '+1',
                });
              }
              return;
            }

            // Severity badges
            const badges = {
              P0: '![P0](https://img.shields.io/badge/P0-red?style=flat)',
              P1: '![P1](https://img.shields.io/badge/P1-orange?style=flat)',
              P2: '![P2](https://img.shields.io/badge/P2-yellow?style=flat)',
            };

            // Build inline review comments
            const comments = [];
            for (const issue of issues) {
              if (!issue.file || !issue.line) continue;
              const badge = badges[issue.severity] || badges.P2;
              comments.push({
                path: issue.file,
                line: issue.line,
                body: `**${badge} ${issue.title || issue.severity}**\n\n${issue.body}\n\nUseful? React with 👍 / 👎.`,
              });
            }

            const reviewBody = `### 💡 Codex Review\n\nFound **${issues.length}** issue(s).\n\n**Reviewed commit:** \`${commitId.substring(0, 10)}\``;

            // Try inline review first
            if (comments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner, repo,
                  pull_number: pr.number,
                  commit_id: commitId,
                  event: 'COMMENT',
                  body: reviewBody,
                  comments,
                });
                return;
              } catch (e) {
                console.log('Inline review failed, falling back:', e.message);
              }
            }

            // Fallback: post as comment
            let body = reviewBody;
            for (const issue of issues) {
              const badge = badges[issue.severity] || badges.P2;
              body += `\n\n### \`${issue.file || 'General'}\`${issue.line ? ` (line ${issue.line})` : ''}\n${badge} **${issue.title || 'Issue'}**\n\n${issue.body}\n\nUseful? React with 👍 / 👎.`;
            }
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: pr.number,
              body,
            });
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
