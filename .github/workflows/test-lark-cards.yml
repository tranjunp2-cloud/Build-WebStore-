# Temporary test workflow — verify new Lark card format on all 3 groups
# DELETE after testing
name: Test Lark Cards

on:
  workflow_dispatch:

jobs:
  test-ci-group:
    name: "Test: CI Group"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Card: CI Passed"
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "✅ CI Passed — staging"
          template: 'green'
          meta-left-label: "📦 Project"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌿 Branch"
          meta-right-value: "staging"
          meta2-left-label: "🔖 Commit"
          meta2-left-value: "abc1234"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.actor }}"
          content: |
            📝 feat(auth): add Google OAuth login
            **Pipeline [1/2]** CI
            Lint ✅  TypeCheck ✅  Test ✅  Build ✅
          buttons: '[{"text":"📋 View CI Run","url":"${{ github.server_url }}/${{ github.repository }}","type":"primary"},{"text":"📄 View Diff","url":"${{ github.server_url }}/${{ github.repository }}","type":"default"}]'

  test-task-group:
    name: "Test: Task Group"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Card: PRD/Stories Updated"
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "📋 PRD/Stories Updated — F02 Auth"
          template: 'purple'
          meta-left-label: "👤 Author"
          meta-left-value: "ben-pm"
          meta-right-label: "🌿 Branch"
          meta-right-value: "staging"
          meta2-left-label: "📁 Files"
          meta2-left-value: "2 files"
          meta2-right-label: "📊 Changes"
          meta2-right-value: "+45 / -12 lines"
          content: |
            📋 **PRD:**
              • F02-auth.md
            📝 **Stories:**
              • F02-auth-stories.md

            ⚠️ **Team cần review:**
            • Dev: Check PRD changes ảnh hưởng code
            • QC: Update test cases theo AC mới

            **CC:** Dev QC
          buttons: '[{"text":"📄 View Changes","url":"${{ github.server_url }}/${{ github.repository }}","type":"primary"},{"text":"📋 View Commit","url":"${{ github.server_url }}/${{ github.repository }}","type":"default"}]'

      - name: "Card: Design Updated"
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "🎨 Design Updated"
          template: 'blue'
          meta-left-label: "👤 Author"
          meta-left-value: "designer"
          meta-right-label: "🌿 Branch"
          meta-right-value: "staging"
          meta2-left-label: "📁 Files"
          meta2-left-value: "1 file"
          meta2-right-label: "📊 Changes"
          meta2-right-value: "+15 / -3 lines"
          content: |
            🎨 **Design:**
              • DESIGN_WORKFLOW.md

            ⚠️ **FE Dev cần aware:**
            Design specs hoặc Figma links có thay đổi → check lại UI implementation

            **CC:** FE-Dev
          buttons: '[{"text":"🎨 View Design","url":"${{ github.server_url }}/${{ github.repository }}","type":"primary"},{"text":"📋 View Commit","url":"${{ github.server_url }}/${{ github.repository }}","type":"default"}]'

      - name: "Card: New PR"
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "🆕 New PR #31"
          template: 'blue'
          meta-left-label: "📦 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌿 Branch"
          meta-right-value: "feature/auth → staging"
          meta2-left-label: "📊 Size"
          meta2-left-value: "size:M (120 lines)"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.actor }}"
          content: |
            📝 feat(auth): add Google OAuth login
            📁 8 files changed
          buttons: '[{"text":"🔍 Review PR","url":"${{ github.server_url }}/${{ github.repository }}","type":"primary"},{"text":"📄 View Files","url":"${{ github.server_url }}/${{ github.repository }}","type":"default"}]'

  test-report-group:
    name: "Test: Report Group"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Card: Weekly Report"
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_REPORT || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_REPORT || '' }}
          title: "📊 Weekly Report — W11"
          template: 'purple'
          meta-left-label: "📦 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "📈 Commits"
          meta-right-value: "45"
          meta2-left-label: "🔀 PRs Merged"
          meta2-left-value: "8"
          meta2-right-label: "✅ Completion"
          meta2-right-value: "75%"
          content: |
            **📅 Period:** Last 7 days

            **📊 Team Summary**
            📝 Commits: **45** | 🔀 PRs Merged: **8** | 📬 PRs Open: **3**
            ⏱️ Avg Review: **3.2h** | 🏗️ CI Pass Rate: **92%**
            ✅ Stories Done: **6** | 📋 Open: **12** | 🎯 Completion: **75%**

            **👥 Per Member**
            • **nhan**: 20 commits, 4 PRs merged
            • **ben**: 15 commits, 2 PRs merged
            • **dev1**: 10 commits, 2 PRs merged
          buttons: '[{"text":"📊 View Details","url":"${{ github.server_url }}/${{ github.repository }}","type":"primary"},{"text":"📈 View Pulse","url":"${{ github.server_url }}/${{ github.repository }}/pulse","type":"default"}]'

      - name: "Card: Sprint Start"
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_REPORT || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_REPORT || '' }}
          title: "🏁 Sprint Start — Monday"
          template: 'blue'
          meta-left-label: "📦 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "📅 Sprint"
          meta-right-value: "Week start"
          content: |
            <at id=all></at>

            **Open Stories:** 12
            **Assigned:** 8 | **Unassigned:** 4
            **Open PRs:** 3 | **Awaiting Review:** 1
          buttons: '[{"text":"📋 View Board","url":"${{ github.server_url }}/${{ github.repository }}/issues","type":"primary"}]'
