name: Targeted Smoke

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Server-created targeted Smoke dispatch ID
        required: true
        type: string
      commit_sha:
        description: Exact staging commit to test
        required: true
        type: string
      pack_id:
        description: Allow-listed targeted Smoke pack
        required: true
        type: string
      workflow_nonce:
        description: Server-issued one-time workflow claim nonce
        required: true
        type: string
      run_profile:
        description: Server-selected QA run provenance
        required: true
        type: choice
        options:
          - targeted-smoke
          - manual-retest
          - manual-smoke

permissions:
  contents: read

jobs:
  targeted-smoke:
    name: Targeted critical-flow Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate immutable dispatch inputs
        shell: bash
        # Inputs are passed through env instead of being interpolated into the
        # script: GitHub treats any string containing an expression as one
        # expression capped at 21,000 characters, and this script is longer
        # than that, so inline interpolation made the whole workflow fail to
        # load. Env vars also keep raw input out of the shell source.
        env:
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_NONCE: ${{ inputs.workflow_nonce }}
          RUN_PROFILE: ${{ inputs.run_profile }}
          PACK_ID: ${{ inputs.pack_id }}
        run: |
          [[ "$DISPATCH_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid dispatch ID'; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[a-fA-F0-9]{7,64}$ ]] || { echo 'Invalid commit SHA'; exit 1; }
          [[ "$WORKFLOW_NONCE" =~ ^[A-Za-z0-9_-]{32}$ ]] || { echo 'Invalid workflow nonce'; exit 1; }
          [[ "$RUN_PROFILE" =~ ^(targeted-smoke|manual-retest|manual-smoke)$ ]] || { echo 'Invalid run profile for a Smoke contract'; exit 1; }
          case "$PACK_ID" in
            identity-login-otp-contract)
              echo 'runner=unit' >> "$GITHUB_OUTPUT"
              echo 'target_id=identity-login-otp' >> "$GITHUB_OUTPUT"
              echo 'pack_version=1' >> "$GITHUB_OUTPUT"
              echo 'spec=src/__tests__/unit/otp/otp-generate.test.ts' >> "$GITHUB_OUTPUT"
              echo 'tc_ids=TC-F01.01' >> "$GITHUB_OUTPUT"
              echo 'grep=TC-F01\.01' >> "$GITHUB_OUTPUT"
              
              ;;
            identity-password-recovery-contract)
              echo 'runner=unit' >> "$GITHUB_OUTPUT"
              echo 'target_id=identity-password-recovery' >> "$GITHUB_OUTPUT"
              echo 'pack_version=1' >> "$GITHUB_OUTPUT"
              echo 'spec=src/__tests__/unit/profile/api-users-me-password.test.ts' >> "$GITHUB_OUTPUT"
              echo 'tc_ids=TC-F01.03' >> "$GITHUB_OUTPUT"
              echo 'grep=TC-F01\.03' >> "$GITHUB_OUTPUT"
              
