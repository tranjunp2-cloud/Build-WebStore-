        id: contract

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - if: steps.contract.outputs.runner == 'smoke'
        run: npx playwright install --with-deps chromium

      - name: Claim the fixture dispatch once
        id: claim
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('crypto')
          const fs = require('fs')
          const body = JSON.stringify({
            dispatchId: Number(process.env.DISPATCH_ID), workflowNonce: process.env.WORKFLOW_NONCE,
            workflowRunId: `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
          })
          const timestamp = Date.now().toString()
          const signature = crypto.createHmac('sha256', process.env.QA_INGEST_SECRET).update(`${timestamp}.${body}`).digest('hex')
          fs.writeFileSync('/tmp/targeted-start-body.json', body)
          fs.writeFileSync('/tmp/targeted-start-headers.txt', `${timestamp}\n${signature}`)
          NODE
          QA_TIMESTAMP=$(sed -n '1p' /tmp/targeted-start-headers.txt)
          QA_SIGNATURE=$(sed -n '2p' /tmp/targeted-start-headers.txt)
          STATUS=$(curl --silent --show-error --output /tmp/targeted-start-response.json --write-out '%{http_code}' -X POST "${BASE_URL}/api/admin/qa/targeted-start" \
            -H 'Content-Type: application/json' \
            -H "x-qa-timestamp: $QA_TIMESTAMP" \
            -H "x-qa-signature: sha256=$QA_SIGNATURE" \
            --data-binary @/tmp/targeted-start-body.json)
          if [[ "$STATUS" != "200" ]]; then
            cat /tmp/targeted-start-response.json
            exit 1
          fi
          if grep -q '"cancelled":true' /tmp/targeted-start-response.json; then
            echo 'cancelled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cancelled=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://web-v2.dev.ecommercehub.my' }}
          QA_INGEST_SECRET: ${{ secrets.QA_INGEST_SECRET }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          WORKFLOW_NONCE: ${{ inputs.workflow_nonce }}

      - name: Provision isolated targeted-Smoke tenant
        if: steps.claim.outputs.cancelled != 'true' && steps.contract.outputs.runner == 'smoke'
        shell: bash
        run: |
          curl --fail-with-body -X POST "${BASE_URL}/api/e2e/ensure-test-user" \
            -H "Authorization: Bearer ${E2E_SETUP_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"password\":\"${TEST_PASSWORD}\",\"tenantSlug\":\"e2e-targeted-smoke\",\"tenantName\":\"Targeted Smoke QA\"}"
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://web-v2.dev.ecommercehub.my' }}
          E2E_SETUP_SECRET: ${{ secrets.E2E_SETUP_SECRET }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Execute exactly one registered contract
        if: steps.claim.outputs.cancelled != 'true'
        id: playwright
        shell: bash
        run: |
          set +e
          if [[ '${{ steps.contract.outputs.runner }}' == 'smoke' ]]; then
            npx playwright test '${{ steps.contract.outputs.spec }}' \
              --project=f40-targeted-smoke \
              --grep '${{ steps.contract.outputs.grep }}' \
              --reporter=json > /tmp/targeted-contract-report.json
          else
            npx vitest run '${{ steps.contract.outputs.spec }}' \
              --testNamePattern '${{ steps.contract.outputs.grep }}' \
              --reporter=json > /tmp/targeted-contract-report.json
          fi
          EXIT_CODE=$?
          export EXIT_CODE
          node <<'NODE'
          const fs = require('fs')
          const ids = process.env.TC_IDS.split(',')
          const report = JSON.parse(fs.readFileSync('/tmp/targeted-contract-report.json', 'utf8'))
          let observations = {}
          try { observations = JSON.parse(fs.readFileSync('/tmp/targeted-smoke-observations.json', 'utf8')) } catch {}
          const observed = new Map()
          const metadata = process.env.RUNNER === 'smoke'
            ? { fixtureReference: process.env.FIXTURE_REFERENCE, classification: 'product', evidenceKind: 'report' }
            : { classification: 'product', evidenceKind: 'report' }
          // Stable contract identity is emitted for both pass and failure so a
          // later required-pack pass can verify the exact finding it retests.
          const assertionCodeFor = id => `TARGETED_SMOKE_${id.replace(/[^A-Za-z0-9]/g, '_').toUpperCase()}`
          const hasExactTcId = (value, id) => {
            const escaped = id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            return new RegExp(`(^|[^A-Za-z0-9_.-])${escaped}($|[^A-Za-z0-9_.-])`).test(value || '')
          }
          function mark(id, status) {
            if (observed.has(id) && observed.get(id).status === 'failed') return
            observed.set(id, { testCaseId: id, status, assertionCode: assertionCodeFor(id), ...metadata })
          }
          function walk(suite) {
            for (const spec of suite.specs || []) {
              for (const id of ids) {
                if (!hasExactTcId(spec.title, id)) continue
                const test = (spec.tests || []).find(test => Array.isArray(test.results) && test.results.length > 0)
                const last = test?.results.at(-1)
                const status = last?.status === 'passed' ? 'passed' : 'failed'
                if (process.env.RUNNER !== 'smoke') { mark(id, status); continue }
                const observation = observations[id]
                const fallbackEvidence = process.env.EXPECTED_COUNT
                  ? { expectedCount: Number(process.env.EXPECTED_COUNT), expectedSummary: process.env.EXPECTED_SUMMARY, actualSummary: 'Measurement unavailable because the test flow stopped before observation.' }
                  : {}
                const measuredEvidence = observation && Number.isInteger(observation.expectedCount) && Number.isInteger(observation.actualCount)
                  ? {
                      fixtureReference: observation.fixtureReference || metadata.fixtureReference,
                      expectedCount: observation.expectedCount,
                      actualCount: observation.actualCount,
                      expectedSummary: observation.expectedSummary,
                      actualSummary: observation.actualSummary,
                      classification: observation.classification || metadata.classification,
                      evidenceKind: observation.evidenceKind || metadata.evidenceKind,
                    }
                  : { ...fallbackEvidence, ...observation }
                observed.set(id, { testCaseId: id, status, assertionCode: assertionCodeFor(id), ...metadata, ...measuredEvidence })
              }
            }
            for (const child of suite.suites || []) walk(child)
          }
          for (const suite of report.suites || []) walk(suite)
          for (const result of report.testResults || []) {
            for (const assertion of result.assertionResults || []) {
              for (const id of ids) {
                if (hasExactTcId(assertion.fullName, id) || hasExactTcId(assertion.title, id))
                  mark(id, assertion.status === 'passed' ? 'passed' : 'failed')
              }
            }
          }
          const results = ids.map(id => observed.get(id) || { testCaseId: id, status: 'failed', assertionCode: assertionCodeFor(id) })
          if (process.env.EXIT_CODE !== '0') {
            for (const result of results) result.status = 'failed'
          }
          fs.writeFileSync('/tmp/targeted-smoke-results.json', JSON.stringify(results))
          if (results.length !== ids.length || results.some(result => result.status !== 'passed')) process.exitCode = 1
          NODE
          if [ "$?" != '0' ]; then EXIT_CODE=1; fi
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://web-v2.dev.ecommercehub.my' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          E2E_TEST_OTP_CODE: ${{ secrets.E2E_TEST_OTP_CODE }}
          RUNNER: ${{ steps.contract.outputs.runner }}
          TC_IDS: ${{ steps.contract.outputs.tc_ids }}
          FIXTURE_REFERENCE: ${{ steps.contract.outputs.fixture }}
          EXPECTED_COUNT: ${{ steps.contract.outputs.expected_count }}
          EXPECTED_SUMMARY: ${{ steps.contract.outputs.expected_summary }}

      - name: Ingest signed results back into QA Control Center
        if: always() && steps.claim.outputs.cancelled != 'true'
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('crypto')
          const fs = require('fs')
          let results = []
          try {
            results = JSON.parse(fs.readFileSync('/tmp/targeted-smoke-results.json', 'utf8'))
          } catch {
            const rawIds = (process.env.TC_IDS || '').split(',').filter(Boolean)
            results = rawIds.map(id => ({
              testCaseId: id,
              status: 'failed',
              assertionCode: `TARGETED_SMOKE_${id.replace(/[^A-Za-z0-9]/g, '_').toUpperCase()}`,
            }))
          }
          const body = JSON.stringify({
            dispatchId: Number(process.env.DISPATCH_ID),
            workflowNonce: process.env.WORKFLOW_NONCE,
            workflowRunId: `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
            targetId: process.env.TARGET_ID,
            packId: process.env.PACK_ID,
            packVersion: Number(process.env.PACK_VERSION),
            commitSha: process.env.COMMIT_SHA,
            results,
          })
          const timestamp = Date.now().toString()
          const signature = crypto.createHmac('sha256', process.env.QA_INGEST_SECRET).update(`${timestamp}.${body}`).digest('hex')
          fs.writeFileSync('/tmp/targeted-ingest-body.json', body)
          fs.writeFileSync('/tmp/targeted-ingest-headers.txt', `${timestamp}\n${signature}`)
          NODE
          QA_TIMESTAMP=$(sed -n '1p' /tmp/targeted-ingest-headers.txt)
          QA_SIGNATURE=$(sed -n '2p' /tmp/targeted-ingest-headers.txt)
          curl --fail-with-body -X POST "${BASE_URL}/api/admin/qa/ingest" \
            -H 'Content-Type: application/json' \
            -H "x-qa-timestamp: $QA_TIMESTAMP" \
            -H "x-qa-signature: sha256=$QA_SIGNATURE" \
            --data-binary @/tmp/targeted-ingest-body.json
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://web-v2.dev.ecommercehub.my' }}
          QA_INGEST_SECRET: ${{ secrets.QA_INGEST_SECRET }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          WORKFLOW_NONCE: ${{ inputs.workflow_nonce }}
          TARGET_ID: ${{ steps.contract.outputs.target_id }}
          PACK_ID: ${{ inputs.pack_id }}
          PACK_VERSION: ${{ steps.contract.outputs.pack_version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TC_IDS: ${{ steps.contract.outputs.tc_ids }}

      - name: Fail workflow if test step failed
        if: steps.claim.outputs.cancelled != 'true'
        shell: bash
        run: |
          if [[ "${{ steps.playwright.outputs.exit_code }}" != "0" ]]; then
            echo "Targeted contract test failed with exit code ${{ steps.playwright.outputs.exit_code }}"
            exit ${{ steps.playwright.outputs.exit_code }}
          fi
