# Delete Preview — cleanup khi PR được merge hoặc close
# Xóa preview app trên DO App Platform
name: Delete Preview

on:
  pull_request:
    types: [closed]

jobs:
  delete-preview:
    name: "Cleanup: Delete Preview App"
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Delete preview app
        uses: digitalocean/app_action/delete@v2
        with:
          from_pr_preview: "true"
          ignore_not_found: "true"
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
