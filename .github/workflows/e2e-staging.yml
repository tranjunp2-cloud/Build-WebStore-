# E2E Tests on Staging — runs after staging deploy succeeds
# Trigger: manual (workflow_dispatch) or after CI passes on staging push
#
# Runs Playwright tests against live staging: https://web-v2.dev.ecommercehub.my
name: E2E Staging

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Staging URL to test'
        default: 'https://web-v2.dev.ecommercehub.my'
        required: false
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]

concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  e2e:
    name: "E2E: Playwright on Staging"
    runs-on: ubuntu-latest
    # Only run if CI succeeded (for workflow_run trigger)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for staging to be ready
        run: |
          URL="${{ inputs.base_url || 'https://web-v2.dev.ecommercehub.my' }}"
          echo "Checking staging: $URL"
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Staging health check failed, running tests anyway"

      - name: Run E2E tests
        id: e2e
        run: |
          set -o pipefail
          npx playwright test --project=smoke --project=setup --project=chromium 2>&1 | tee e2e-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          # Parse results from Playwright output: "53 passed (2.6m)" or "4 failed" or "5 skipped"
          PASSED=$(grep -oE '[0-9]+ passed' e2e-output.log | tail -1 | grep -oE '^[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' e2e-output.log | tail -1 | grep -oE '^[0-9]+' || echo "0")
          SKIPPED=$(grep -oE '[0-9]+ skipped' e2e-output.log | tail -1 | grep -oE '^[0-9]+' || echo "0")
          TOTAL=$((${PASSED:-0} + ${FAILED:-0} + ${SKIPPED:-0}))
          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED:-0}" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          BASE_URL: ${{ inputs.base_url || 'https://web-v2.dev.ecommercehub.my' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          E2E_TEST_OTP_CODE: ${{ secrets.E2E_TEST_OTP_CODE }}
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 3

      - name: Prepare notification info
        if: always()
        id: notify_info
        run: |
          # Works for both workflow_dispatch and workflow_run triggers
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          AUTHOR="${{ github.event.workflow_run.actor.login || github.actor }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(git log --format='%s' -n 1 2>/dev/null | head -c 80 || echo "E2E staging run")
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Notify E2E Failed
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          lark-webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          lark-sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          event: 'ci_fail'
          branch: ${{ steps.notify_info.outputs.branch }}
          author: ${{ steps.notify_info.outputs.author }}
          commit-sha: ${{ steps.notify_info.outputs.short_sha }}
          commit-msg: ${{ steps.notify_info.outputs.commit_msg }}
          failed-step: 'E2E Tests (staging)'
          ci-status: "E2E: ${{ steps.e2e.outputs.passed }}/${{ steps.e2e.outputs.total }} passed, ${{ steps.e2e.outputs.failed }} failed, ${{ steps.e2e.outputs.skipped }} skipped"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
