# E2E Tests on Staging — runs after staging push
# Triggers: push to staging (when E2E files change), or manual dispatch
#
# Note: workflow_dispatch and workflow_run require file on default branch (main).
# Until this workflow lands on main, we trigger via `push` on staging.
#
# Runs browser/admin API checks against live CMS staging. Storefront fixtures
# resolve their own tenant subdomain separately.
name: E2E Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging URL to test"
        default: "https://web-cms-v2.dev.ecommercehub.my"
        required: false

concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  e2e:
    name: "E2E: Playwright on Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The deploy-impact snapshot compares the deployed commit to its parent.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for targeted Smoke API boundary checks
        run: npx playwright install --with-deps chromium

      - name: Wait for NEW staging deploy to be ready
        id: staging_deploy
        run: |
          URL="${{ inputs.base_url || 'https://web-cms-v2.dev.ecommercehub.my' }}"
          echo "Waiting for Vercel deploy: $URL"
          # The staging alias can point to the prior deployment while Vercel builds.
          # Poll the deployed commit identity; route existence/status alone cannot
          # prove this exact SHA is live.
          #
          # Vercel deploy typically takes 2-3 min for Next.js apps.
          sleep 45
          for i in {1..30}; do
            HEALTH=$(curl -fsS "$URL/api/health" || true)
            DEPLOYED_SHA=$(printf '%s' "$HEALTH" | jq -r '.commitSha // empty' 2>/dev/null || true)
            if [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then
              echo "Expected staging deploy $DEPLOYED_SHA is live on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30: deployed SHA '${DEPLOYED_SHA:-unavailable}' is not '$GITHUB_SHA', retrying in 10s..."
            sleep 10
          done
          echo "::error::New deploy didn't appear after 6 min — aborting"
          exit 1

      - name: Ensure E2E test user exists
        run: |
          BASE_URL="${{ inputs.base_url || 'https://web-cms-v2.dev.ecommercehub.my' }}"
          if [ -z "${{ secrets.E2E_SETUP_SECRET }}" ]; then
            echo "::warning::E2E_SETUP_SECRET not set — skipping user provisioning"
            exit 0
          fi
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$BASE_URL/api/e2e/ensure-test-user" \
            -H "Authorization: Bearer ${{ secrets.E2E_SETUP_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg e "${{ secrets.TEST_EMAIL }}" --arg p "${{ secrets.TEST_PASSWORD }}" '{email:$e,password:$p}')")
          STATUS=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "Status: $STATUS"
          echo "Body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::E2E user provisioning failed (status $STATUS)"
            exit 1
          fi

      - name: Run E2E tests
        id: e2e
        shell: bash
        run: |
          # Disable set -e so we can capture playwright exit code and parse stats
          # even when tests fail. GitHub Actions defaults bash to `set -eo pipefail`.
          set +e
          # Run only specs compatible with a fresh e2e-bot tenant (no pre-existing
          # data). Legacy specs (blog-crud, products-crud, orders-flow, settings-flow,
          # storefront) assume real data and time out on empty state × retry × 3.
          npx playwright test \
            smoke.spec.ts \
            auth.setup.ts \
            auth-flow.spec.ts \
            dashboard.spec.ts \
            builder.spec.ts \
            editor.spec.ts \
            admin.spec.ts \
            notifications.spec.ts \
            products.spec.ts \
            orders.spec.ts \
            gh1573-easyparcel-oauth.spec.ts \
            tests/cart-drawer.spec.ts \
            tests/gh-1734-self-delivery-complete.spec.ts \
            tests/f40-qa-ingest.spec.ts \
            tests/f40-project-health.spec.ts \
            --project=smoke --project=setup --project=chromium --project=storefront-regression --project=gh-1734-self-delivery --project=f40-qa-ingest --project=f40-project-health 2>&1 | tee e2e-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          # Parse results. Playwright outputs: "53 passed", "4 failed", "5 skipped", "N did not run"
          PASSED=$(grep -oE '[0-9]+ passed' e2e-output.log | tail -1 | grep -oE '^[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' e2e-output.log | tail -1 | grep -oE '^[0-9]+' || echo "0")
          SKIPPED=$(grep -oE '[0-9]+ skipped' e2e-output.log | tail -1 | grep -oE '^[0-9]+' || echo "0")
          DID_NOT_RUN=$(grep -oE '[0-9]+ did not run' e2e-output.log | tail -1 | grep -oE '^[0-9]+' || echo "0")
          TOTAL=$((${PASSED:-0} + ${FAILED:-0} + ${SKIPPED:-0} + ${DID_NOT_RUN:-0}))
          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED:-0}" >> "$GITHUB_OUTPUT"
          echo "did_not_run=${DID_NOT_RUN:-0}" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "=== Stats: $PASSED passed, $FAILED failed, $SKIPPED skipped, $DID_NOT_RUN did not run (total $TOTAL) ==="
          exit $EXIT_CODE
        env:
          BASE_URL: ${{ inputs.base_url || 'https://web-cms-v2.dev.ecommercehub.my' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          E2E_TEST_OTP_CODE: ${{ secrets.E2E_TEST_OTP_CODE }}
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          QA_INGEST_SECRET: ${{ secrets.QA_INGEST_SECRET }}

      - name: Resolve source PR for staging deploy
        id: qa_context
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')
          if [ "${{ github.event_name }}" = "push" ] && [ -z "$PR_NUMBER" ]; then
            echo "::error::No source PR could be resolved for staging commit ${GITHUB_SHA}; refusing to publish incomplete deploy impact."
            exit 1
          fi
          echo "pull_request=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Resolve QA change impact
        id: qa_impact
        if: always()
        run: |
          git diff --name-only HEAD^ HEAD > /tmp/qa-changed-paths.txt
          if [ "$(wc -l < /tmp/qa-changed-paths.txt)" -gt 500 ]; then
            echo "::error::Deploy changed more than 500 paths; refusing to publish an incomplete coverage snapshot."
            exit 1
          fi
          ./node_modules/.bin/tsx scripts/qa/resolve-change-impact.ts --paths-file /tmp/qa-changed-paths.txt > /tmp/qa-change-impact.json
          echo "mapped_targets=$(jq '.mappedTargetIds | length' /tmp/qa-change-impact.json)" >> "$GITHUB_OUTPUT"
          echo "unmapped_paths=$(jq '.unmappedPaths | length' /tmp/qa-change-impact.json)" >> "$GITHUB_OUTPUT"

      - name: Dispatch allow-listed targeted Smoke packs
        if: always() && steps.staging_deploy.outcome == 'success' && steps.qa_context.outcome == 'success' && steps.qa_impact.outcome == 'success'
        env:
          BASE_URL: ${{ inputs.base_url || 'https://web-cms-v2.dev.ecommercehub.my' }}
          QA_TARGETED_DISPATCH_SECRET: ${{ secrets.QA_TARGETED_DISPATCH_SECRET }}
          F40_TARGETED_SMOKE_ENABLED: ${{ vars.F40_TARGETED_SMOKE_ENABLED || 'false' }}
          QA_PULL_REQUEST: ${{ steps.qa_context.outputs.pull_request }}
        run: |
          if [ "$F40_TARGETED_SMOKE_ENABLED" != 'true' ]; then
            echo 'F40 targeted Smoke rollout is disabled; dispatch intentionally skipped.'
            exit 0
          fi
          if [ -z "$QA_TARGETED_DISPATCH_SECRET" ]; then
            echo '::error::QA_TARGETED_DISPATCH_SECRET is required when targeted Smoke is enabled.'
            exit 1
          fi
          node <<'NODE'
          const crypto = require('crypto')
          const fs = require('fs')
          const changedPaths = fs.readFileSync('/tmp/qa-changed-paths.txt', 'utf8').trim().split('\n').filter(Boolean)
          const pullRequest = Number(process.env.QA_PULL_REQUEST || 0)
          if (!Number.isInteger(pullRequest) || pullRequest < 1) throw new Error('A source PR is required')
          const body = { pullRequest, commitSha: process.env.GITHUB_SHA, environment: 'staging', changedPaths }
          const raw = JSON.stringify(body)
          const timestamp = Date.now().toString()
          const signature = crypto.createHmac('sha256', process.env.QA_TARGETED_DISPATCH_SECRET).update(`${timestamp}.${raw}`).digest('hex')
          require('fs').writeFileSync('/tmp/qa-targeted-dispatch-body.json', raw)
          require('fs').writeFileSync('/tmp/qa-targeted-dispatch-headers.txt', `${timestamp}\n${signature}`)
          NODE
          QA_TIMESTAMP=$(sed -n '1p' /tmp/qa-targeted-dispatch-headers.txt)
          QA_SIGNATURE=$(sed -n '2p' /tmp/qa-targeted-dispatch-headers.txt)
          curl --fail-with-body --retry 3 --retry-all-errors -X POST "$BASE_URL/api/internal/qa/targeted-dispatch" \
            -H 'Content-Type: application/json' -H "x-qa-timestamp: $QA_TIMESTAMP" -H "x-qa-signature: sha256=$QA_SIGNATURE" \
            --data-binary @/tmp/qa-targeted-dispatch-body.json

      - name: Verify targeted Smoke API security boundaries
        env:
          BASE_URL: ${{ inputs.base_url || 'https://web-cms-v2.dev.ecommercehub.my' }}
        run: npx playwright test tests/f40-targeted-smoke-api.spec.ts --project=f40-targeted-smoke-api

      - name: Prepare notification info
        if: always()
        id: notify_info
        run: |
          # Works for both workflow_dispatch and workflow_run triggers
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          AUTHOR="${{ github.event.workflow_run.actor.login || github.actor }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(git log --format='%s' -n 1 2>/dev/null | head -c 80 || echo "E2E staging run")
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Notify E2E Failed
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: "ci_fail"
          branch: ${{ steps.notify_info.outputs.branch }}
          author: ${{ steps.notify_info.outputs.author }}
          commit-sha: ${{ steps.notify_info.outputs.short_sha }}
          commit-msg: ${{ steps.notify_info.outputs.commit_msg }}
          failed-step: "E2E Tests (staging)"
          ci-status: "E2E: ${{ steps.e2e.outputs.passed }}/${{ steps.e2e.outputs.total }} passed · ${{ steps.e2e.outputs.failed }} failed · ${{ steps.e2e.outputs.skipped }} skipped · ${{ steps.e2e.outputs.did_not_run }} did not run"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
