name: E2E Full Regression

on:
  schedule:
    # Broad regression is deliberately decoupled from each staging deployment.
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging URL to test
        required: false
        default: https://web-cms-v2.dev.ecommercehub.my

permissions:
  contents: read

jobs:
  full-regression:
    name: Full regression on staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provision the isolated regression tenant
        shell: bash
        run: |
          curl --fail-with-body -X POST "$BASE_URL/api/e2e/ensure-test-user" \
            -H "Authorization: Bearer $E2E_SETUP_SECRET" -H 'Content-Type: application/json' \
            --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}"
        env:
          BASE_URL: ${{ inputs.base_url || 'https://web-cms-v2.dev.ecommercehub.my' }}
          E2E_SETUP_SECRET: ${{ secrets.E2E_SETUP_SECRET }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Run the governed broad regression allow-list
        run: |
          npx playwright test \
            smoke.spec.ts auth.setup.ts auth-flow.spec.ts dashboard.spec.ts builder.spec.ts editor.spec.ts \
            admin.spec.ts notifications.spec.ts products.spec.ts orders.spec.ts gh1573-easyparcel-oauth.spec.ts \
            tests/cart-drawer.spec.ts tests/gh-1734-self-delivery-complete.spec.ts tests/f40-qa-ingest.spec.ts \
            --project=smoke --project=setup --project=chromium --project=storefront-regression \
            --project=gh-1734-self-delivery --project=f40-qa-ingest
        env:
          BASE_URL: ${{ inputs.base_url || 'https://web-cms-v2.dev.ecommercehub.my' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          E2E_TEST_OTP_CODE: ${{ secrets.E2E_TEST_OTP_CODE }}
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          QA_INGEST_SECRET: ${{ secrets.QA_INGEST_SECRET }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-playwright-report
          path: playwright-report/
          retention-days: 7
