# Deploy Staging — chạy SAU KHI CI pass trên nhánh staging
# Pipeline: CI [1/2] → Deploy Staging [2/2]
name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: "Deploy: Staging [2/2]"
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_OPTIONS: '--require ./node-polyfill.js'
          NEXT_PUBLIC_APP_ENV: staging
        run: npm run build

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # --- Lark: Staging Deployed ---
      - name: Notify Lark (Staging Deployed)
        if: success()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_SIGN_KEY: ${{ secrets.LARK_SIGN_KEY }}
        run: |
          TIMESTAMP=$(date +%s)
          SIGN=$(echo -n "" | openssl dgst -sha256 -hmac "$(printf '%s\n%s' "$TIMESTAMP" "$LARK_SIGN_KEY")" -binary | base64 2>/dev/null || echo "")
          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          AUTHOR="${{ github.event.workflow_run.actor.login }}"
          TIME=$(date -u +"%H:%M UTC")
          COMMIT_MSG=$(git log --format='%s' -n 1 | head -c 80)
          curl -s -X POST "$LARK_WEBHOOK" -H 'Content-Type: application/json' -d '{
            "timestamp": "'"$TIMESTAMP"'",
            "sign": "'"$SIGN"'",
            "msg_type": "interactive",
            "card": {
              "header": {"title": {"tag": "plain_text", "content": "🚀 Staging Deployed"}, "template": "blue"},
              "elements": [
                {"tag": "column_set", "flex_mode": "none", "background_style": "default", "columns": [
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**📦 Project**\nPrimeWeb"}}]},
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**🌍 Environment**\nStaging"}}]}
                ]},
                {"tag": "column_set", "flex_mode": "none", "background_style": "default", "columns": [
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**🔖 Commit**\n'"$SHORT_SHA"'"}}]},
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**👤 Author**\n'"$AUTHOR"'"}}]}
                ]},
                {"tag": "hr"},
                {"tag": "div", "text": {"tag": "lark_md", "content": "📝 '"$COMMIT_MSG"'\n**Pipeline [2/2]** Staging Deploy\n🕐 '"$TIME"'  ·  CI ✅  Deploy ✅"}},
                {"tag": "action", "actions": [{"tag": "button", "text": {"tag": "plain_text", "content": "📋 View Deploy"}, "url": "'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'", "type": "primary"}]}
              ]
            }
          }' || true

      # --- Lark: Staging Deploy Failed ---
      - name: Notify Lark (Staging Deploy Failed)
        if: failure()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_SIGN_KEY: ${{ secrets.LARK_SIGN_KEY }}
        run: |
          TIMESTAMP=$(date +%s)
          SIGN=$(echo -n "" | openssl dgst -sha256 -hmac "$(printf '%s\n%s' "$TIMESTAMP" "$LARK_SIGN_KEY")" -binary | base64 2>/dev/null || echo "")
          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          AUTHOR="${{ github.event.workflow_run.actor.login }}"
          TIME=$(date -u +"%H:%M UTC")
          COMMIT_MSG=$(git log --format='%s' -n 1 | head -c 80)
          curl -s -X POST "$LARK_WEBHOOK" -H 'Content-Type: application/json' -d '{
            "timestamp": "'"$TIMESTAMP"'",
            "sign": "'"$SIGN"'",
            "msg_type": "interactive",
            "card": {
              "header": {"title": {"tag": "plain_text", "content": "❌ Staging Deploy Failed"}, "template": "red"},
              "elements": [
                {"tag": "column_set", "flex_mode": "none", "background_style": "default", "columns": [
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**📦 Project**\nPrimeWeb"}}]},
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**🌍 Environment**\nStaging"}}]}
                ]},
                {"tag": "column_set", "flex_mode": "none", "background_style": "default", "columns": [
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**🔖 Commit**\n'"$SHORT_SHA"'"}}]},
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**👤 Author**\n'"$AUTHOR"'"}}]}
                ]},
                {"tag": "hr"},
                {"tag": "div", "text": {"tag": "lark_md", "content": "📝 '"$COMMIT_MSG"'\n⚠️ **Staging deploy failed!** Pipeline failed at step [2/2].\n🕐 '"$TIME"'"}},
                {"tag": "action", "actions": [{"tag": "button", "text": {"tag": "plain_text", "content": "🔍 View Logs"}, "url": "'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'", "type": "danger"}]}
              ]
            }
          }' || true
