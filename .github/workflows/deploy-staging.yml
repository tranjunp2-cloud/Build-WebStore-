# Deploy Staging — chạy khi push lên nhánh staging
# Mục đích: QA, demo, test trước khi lên production
name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_OPTIONS: '--require ./node-polyfill.js'
          NEXT_PUBLIC_APP_ENV: staging
        run: npm run build

      # Bước deploy: tùy hạ tầng (Docker, Vercel, SSH, …) cấu hình thêm
      - name: Deploy to Staging
        run: |
          echo "Staging build OK. Configure deploy step (Docker push / SSH / Vercel) via repo secrets."
          # Ví dụ Docker: docker build -t $REGISTRY/app:staging . && docker push ...
          # Ví dụ Vercel: npx vercel deploy --prebuilt --token=$VERCEL_TOKEN --env=staging
          # Ví dụ SSH: rsync -avz .next/ $STAGING_HOST:~/app/.next/
