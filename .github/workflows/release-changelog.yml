# Release & Changelog — Auto-generate on merge to main
name: Release & Changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    name: 'Release: Tag & Changelog'
    if: github.event.pull_request.merged == true
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get last tag
        id: tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Last tag: $LAST_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          node .github/scripts/generate-changelog.js \
            --from "${{ steps.tag.outputs.last_tag }}" \
            --to HEAD > changelog.md

          NEW_VERSION=$(cat .new-version)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: v$NEW_VERSION"

          # Truncate for Lark (max 500 chars)
          SUMMARY=$(head -c 500 changelog.md)
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.changelog.outputs.new_version }}"
          git push origin "v${{ steps.changelog.outputs.new_version }}"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.md', 'utf8');
            const version = '${{ steps.changelog.outputs.new_version }}';

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body: changelog,
              target_commitish: context.sha,
            });

            core.setOutput('release_url', release.html_url);

      - name: Notify Lark (Release)
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_REPORT || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_REPORT || '' }}
          title: "🏷️ Release v${{ steps.changelog.outputs.new_version }}"
          template: 'green'
          meta-left-label: "📦 Version"
          meta-left-value: "v${{ steps.changelog.outputs.new_version }}"
          meta-right-label: "👤 Author"
          meta-right-value: "${{ github.event.pull_request.user.login }}"
          content: |
            **PR:** #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}

            ${{ steps.changelog.outputs.summary }}
          buttons: '[{"text":"🏷️ View Release","url":"${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.changelog.outputs.new_version }}","type":"primary"}]'
