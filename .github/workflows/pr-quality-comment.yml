# PR Quality Metrics — Coverage diff + bundle size comment on PRs
name: PR Quality Metrics

on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-metrics:
    name: 'Quality: Coverage & Bundle'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: coverage
        continue-on-error: true
        run: |
          npx vitest run --coverage --reporter=json --outputFile=coverage-report.json 2>/dev/null || true

          # Parse coverage summary
          if [ -f "coverage/coverage-summary.json" ]; then
            LINES=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.branches.pct)")
            FUNCTIONS=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.functions.pct)")
            STATEMENTS=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.statements.pct)")
          else
            LINES="N/A"
            BRANCHES="N/A"
            FUNCTIONS="N/A"
            STATEMENTS="N/A"
          fi

          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "statements=$STATEMENTS" >> "$GITHUB_OUTPUT"

      - name: Build and measure bundle
        id: bundle
        continue-on-error: true
        env:
          NODE_OPTIONS: '--require ./node-polyfill.js'
        run: |
          npm run build 2>&1 | tee build-output.txt || true

          # Get total bundle size
          if [ -d ".next" ]; then
            TOTAL_SIZE=$(du -sh .next/ 2>/dev/null | cut -f1 || echo "N/A")

            # Extract First Load JS from build output
            FIRST_LOAD=$(grep -oP 'First Load JS shared by all\s+\K[\d.]+ [kKmM]?B' build-output.txt 2>/dev/null || echo "N/A")
            if [ "$FIRST_LOAD" = "" ]; then
              FIRST_LOAD="N/A"
            fi
          else
            TOTAL_SIZE="N/A"
            FIRST_LOAD="N/A"
          fi

          echo "total_size=$TOTAL_SIZE" >> "$GITHUB_OUTPUT"
          echo "first_load=$FIRST_LOAD" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = {
              lines: '${{ steps.coverage.outputs.lines }}',
              branches: '${{ steps.coverage.outputs.branches }}',
              functions: '${{ steps.coverage.outputs.functions }}',
              statements: '${{ steps.coverage.outputs.statements }}',
            };

            const bundle = {
              totalSize: '${{ steps.bundle.outputs.total_size }}',
              firstLoad: '${{ steps.bundle.outputs.first_load }}',
            };

            const marker = '<!-- quality-metrics -->';
            const body = `${marker}
            ## Quality Metrics

            ### Test Coverage
            | Metric | Value |
            |--------|-------|
            | Lines | ${coverage.lines}% |
            | Branches | ${coverage.branches}% |
            | Functions | ${coverage.functions}% |
            | Statements | ${coverage.statements}% |

            ### Bundle Size
            | Asset | Size |
            |-------|------|
            | Total (.next/) | ${bundle.totalSize} |
            | First Load JS | ${bundle.firstLoad} |

            ---
            _Updated: ${new Date().toISOString()} | [View CI Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Alert on quality degradation
        if: steps.coverage.outputs.lines != 'N/A'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "📊 Quality Report — PR #${{ github.event.pull_request.number }}"
          template: 'blue'
          meta-left-label: "🧪 Coverage"
          meta-left-value: "Lines ${{ steps.coverage.outputs.lines }}%"
          meta-right-label: "📦 Bundle"
          meta-right-value: "${{ steps.bundle.outputs.total_size }}"
          content: |
            📝 ${{ github.event.pull_request.title }}
            Branches ${{ steps.coverage.outputs.branches }}% | First Load ${{ steps.bundle.outputs.first_load }}
          buttons: '[{"text":"🔗 View PR","url":"${{ github.event.pull_request.html_url }}","type":"primary"}]'
