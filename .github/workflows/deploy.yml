name: CD & Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Application
        run: |
          npm ci
          npm run build
        continue-on-error: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/primeweb-v2:${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/primeweb-v2:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/primeweb-v2:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/primeweb-v2:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/primeweb-v2:latest
        continue-on-error: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to AWS EC2 via SSM (Support multiple EC2 instances)
        uses: aws-actions/aws-ssm-send-command@v1.0.0
        if: ${{ secrets.EC2_INSTANCE_IDS != '' }}
        with:
          document-name: "AWS-RunShellScript"
          instance-ids: ${{ secrets.EC2_INSTANCE_IDS }}
          working-directory: "/home/ec2-user/app"
          command: |
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            ./dockerctl update

      - name: Notify Lark (Deploy Status)
        if: always()
        run: |
          if [ -n "${{ secrets.LARK_WEBHOOK_URL }}" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{
                "msg_type": "interactive",
                "card": {
                  "header": {
                    "title": { "content": "'"${{ job.status == 'success' && '🚀 Deploy Success' || '🚨 Deploy Failed' }}"'", "tag": "plain_text" },
                    "template": "'"${{ job.status == 'success' && 'green' || 'red' }}"'"
                  },
                  "elements": [
                    {
                      "tag": "div",
                      "text": {
                        "content": "**Branch:** main\n**Commit:** ${{ github.sha }}\n**Author:** ${{ github.actor }}\n**Environment:** Production",
                        "tag": "lark_md"
                      }
                    }
                  ]
                }
              }' ${{ secrets.LARK_WEBHOOK_URL }}
          else
            echo "Lark Webhook URL not configured. Skipping notification."
          fi
