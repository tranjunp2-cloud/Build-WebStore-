# Doc Change Notify — Alert team when docs/specs are updated
# Priority flows:
#   1. BA changes PRD/Stories → notify Dev + QC (Task group)
#   2. UI/UX changes Design → notify FE Dev (Task group)
#   3. Other docs (SPEC, CLAUDE, Architecture, QA) → general notify
name: Doc Change Notify

on:
  push:
    branches: [main, staging]
    paths:
      - 'SPEC.md'
      - 'CLAUDE.md'
      - 'docs/prd/**'
      - 'docs/stories/**'
      - 'docs/design/**'
      - 'docs/architecture/**'
      - 'docs/qa/**'

jobs:
  notify:
    name: 'Notify: Doc Changes'
    runs-on: ${{ vars.CI_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect and classify changes
        id: detect
        run: |
          # Get changed files
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- \
            SPEC.md CLAUDE.md \
            docs/prd/ docs/stories/ docs/design/ docs/architecture/ docs/qa/ \
            2>/dev/null || echo "")

          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          # ── Classify by type ──
          HAS_PRD=false; HAS_STORIES=false; HAS_DESIGN=false
          HAS_ARCH=false; HAS_QA=false; HAS_SPEC=false; HAS_CLAUDE=false
          PRD_FILES=""; STORY_FILES=""; DESIGN_FILES=""
          ARCH_FILES=""; QA_FILES=""
          CATEGORIES=""

          if echo "$CHANGED" | grep -q "^docs/prd/"; then
            HAS_PRD=true
            PRD_FILES=$(echo "$CHANGED" | grep "^docs/prd/" | sed 's|docs/prd/||')
            CATEGORIES="${CATEGORIES}PRD "
          fi

          if echo "$CHANGED" | grep -q "^docs/stories/"; then
            HAS_STORIES=true
            STORY_FILES=$(echo "$CHANGED" | grep "^docs/stories/" | sed 's|docs/stories/||')
            CATEGORIES="${CATEGORIES}Stories "
          fi

          if echo "$CHANGED" | grep -q "^docs/design/"; then
            HAS_DESIGN=true
            DESIGN_FILES=$(echo "$CHANGED" | grep "^docs/design/" | sed 's|docs/design/||')
            CATEGORIES="${CATEGORIES}Design "
          fi

          if echo "$CHANGED" | grep -q "^docs/architecture/"; then
            HAS_ARCH=true
            ARCH_FILES=$(echo "$CHANGED" | grep "^docs/architecture/" | sed 's|docs/architecture/||')
            CATEGORIES="${CATEGORIES}Architecture "
          fi

          if echo "$CHANGED" | grep -q "^docs/qa/"; then
            HAS_QA=true
            QA_FILES=$(echo "$CHANGED" | grep "^docs/qa/" | sed 's|docs/qa/||')
            CATEGORIES="${CATEGORIES}QA "
          fi

          if echo "$CHANGED" | grep -q "^SPEC.md"; then
            HAS_SPEC=true
            CATEGORIES="${CATEGORIES}SPEC "
          fi

          if echo "$CHANGED" | grep -q "^CLAUDE.md"; then
            HAS_CLAUDE=true
            CATEGORIES="${CATEGORIES}Agent-Rules "
          fi

          # Count files and get diff stats
          FILE_COUNT=$(echo "$CHANGED" | wc -l | tr -d ' ')
          DIFF_STAT=$(git diff --stat HEAD~1 HEAD -- \
            SPEC.md CLAUDE.md docs/prd/ docs/stories/ docs/design/ docs/architecture/ docs/qa/ \
            2>/dev/null | tail -1 | sed 's/^ *//' || echo "")

          # Extract +/- from stat line (e.g. "3 files changed, 45 insertions(+), 12 deletions(-)")
          INSERTIONS=$(echo "$DIFF_STAT" | grep -oP '\d+ insertion' | grep -oP '\d+' || echo "0")
          DELETIONS=$(echo "$DIFF_STAT" | grep -oP '\d+ deletion' | grep -oP '\d+' || echo "0")
          CHANGES_TEXT="+${INSERTIONS} / -${DELETIONS} lines"

          # Try to extract feature ID from filenames (e.g. F02-auth.md → F02 Auth)
          FEATURE_CONTEXT=""
          ALL_DOC_FILES=$(echo "$CHANGED" | grep "^docs/" || echo "")
          FEATURE_ID=$(echo "$ALL_DOC_FILES" | head -1 | grep -oP 'F\d+' || echo "")
          if [ -n "$FEATURE_ID" ]; then
            FEATURE_NAME=$(echo "$ALL_DOC_FILES" | head -1 | sed 's|.*/||' | sed 's/\.md$//' | sed "s/^${FEATURE_ID}-//" | sed 's/-stories$//' | sed 's/-/ /g')
            FEATURE_CONTEXT="${FEATURE_ID} ${FEATURE_NAME}"
          fi

          # ── Build detailed file list for card body ──
          FILE_DETAILS=""

          if [ "$HAS_PRD" = "true" ]; then
            FILE_DETAILS="${FILE_DETAILS}📋 **PRD:**\n"
            while IFS= read -r f; do
              FILE_DETAILS="${FILE_DETAILS}  • ${f}\n"
            done <<< "$PRD_FILES"
          fi

          if [ "$HAS_STORIES" = "true" ]; then
            FILE_DETAILS="${FILE_DETAILS}📝 **Stories:**\n"
            while IFS= read -r f; do
              FILE_DETAILS="${FILE_DETAILS}  • ${f}\n"
            done <<< "$STORY_FILES"
          fi

          if [ "$HAS_DESIGN" = "true" ]; then
            FILE_DETAILS="${FILE_DETAILS}🎨 **Design:**\n"
            while IFS= read -r f; do
              FILE_DETAILS="${FILE_DETAILS}  • ${f}\n"
            done <<< "$DESIGN_FILES"
          fi

          if [ "$HAS_ARCH" = "true" ]; then
            FILE_DETAILS="${FILE_DETAILS}🏗️ **Architecture:**\n"
            while IFS= read -r f; do
              FILE_DETAILS="${FILE_DETAILS}  • ${f}\n"
            done <<< "$ARCH_FILES"
          fi

          if [ "$HAS_QA" = "true" ]; then
            FILE_DETAILS="${FILE_DETAILS}🧪 **QA:**\n"
            while IFS= read -r f; do
              FILE_DETAILS="${FILE_DETAILS}  • ${f}\n"
            done <<< "$QA_FILES"
          fi

          if [ "$HAS_SPEC" = "true" ]; then
            FILE_DETAILS="${FILE_DETAILS}📖 **SPEC.md** updated\n"
          fi

          if [ "$HAS_CLAUDE" = "true" ]; then
            FILE_DETAILS="${FILE_DETAILS}🤖 **CLAUDE.md** updated\n"
          fi

          # ── Determine notification type ──
          # Priority: PRD/Stories → Design → Mixed
          ONLY_PRD_STORIES=false
          ONLY_DESIGN=false

          if { [ "$HAS_PRD" = "true" ] || [ "$HAS_STORIES" = "true" ]; } && \
             [ "$HAS_DESIGN" = "false" ] && [ "$HAS_ARCH" = "false" ] && \
             [ "$HAS_QA" = "false" ] && [ "$HAS_SPEC" = "false" ] && [ "$HAS_CLAUDE" = "false" ]; then
            ONLY_PRD_STORIES=true
          fi

          if [ "$HAS_DESIGN" = "true" ] && \
             [ "$HAS_PRD" = "false" ] && [ "$HAS_STORIES" = "false" ] && \
             [ "$HAS_ARCH" = "false" ] && [ "$HAS_QA" = "false" ] && \
             [ "$HAS_SPEC" = "false" ] && [ "$HAS_CLAUDE" = "false" ]; then
            ONLY_DESIGN=true
          fi

          # ── Build action items per role ──
          ACTION_ITEMS=""
          ROLES=""

          if [ "$HAS_PRD" = "true" ] || [ "$HAS_STORIES" = "true" ]; then
            ACTION_ITEMS="${ACTION_ITEMS}⚠️ **Team cần review:**\n"
            ACTION_ITEMS="${ACTION_ITEMS}• Dev: Check PRD changes ảnh hưởng code\n"
            ACTION_ITEMS="${ACTION_ITEMS}• QC: Update test cases theo AC mới\n"
            ROLES="${ROLES}Dev QC "
          fi

          if [ "$HAS_DESIGN" = "true" ]; then
            if [ -n "$ACTION_ITEMS" ]; then
              ACTION_ITEMS="${ACTION_ITEMS}• FE Dev: Check lại UI implementation\n"
            else
              ACTION_ITEMS="⚠️ **FE Dev cần aware:**\nDesign specs hoặc Figma links có thay đổi → check lại UI implementation\n"
            fi
            ROLES="${ROLES}FE-Dev "
          fi

          if [ "$HAS_ARCH" = "true" ]; then
            ROLES="${ROLES}Tech-Lead "
          fi

          if [ "$HAS_QA" = "true" ]; then
            ROLES="${ROLES}QC "
          fi

          if [ "$HAS_SPEC" = "true" ]; then
            ROLES="${ROLES}All-team "
          fi

          UNIQUE_ROLES=$(echo "$ROLES" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/ $//')

          # ── Store outputs ──
          echo "has_prd=$HAS_PRD" >> "$GITHUB_OUTPUT"
          echo "has_stories=$HAS_STORIES" >> "$GITHUB_OUTPUT"
          echo "has_design=$HAS_DESIGN" >> "$GITHUB_OUTPUT"
          echo "only_prd_stories=$ONLY_PRD_STORIES" >> "$GITHUB_OUTPUT"
          echo "only_design=$ONLY_DESIGN" >> "$GITHUB_OUTPUT"
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "changes_text=$CHANGES_TEXT" >> "$GITHUB_OUTPUT"
          echo "categories=$CATEGORIES" >> "$GITHUB_OUTPUT"
          echo "feature_context=$FEATURE_CONTEXT" >> "$GITHUB_OUTPUT"
          echo "unique_roles=$UNIQUE_ROLES" >> "$GITHUB_OUTPUT"

          # Multiline outputs
          {
            echo "file_details<<EOF"
            echo -e "$FILE_DETAILS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "action_items<<EOF"
            echo -e "$ACTION_ITEMS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────
      # Card Type 1: PRD / Stories only
      # ──────────────────────────────────────
      - name: "Notify Lark — PRD/Stories Updated"
        if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.only_prd_stories == 'true'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "📋 PRD/Stories Updated — ${{ steps.detect.outputs.feature_context || steps.detect.outputs.categories }}"
          template: 'purple'
          meta-left-label: "👤 Author"
          meta-left-value: "${{ github.actor }}"
          meta-right-label: "🌿 Branch"
          meta-right-value: "${{ github.ref_name }}"
          meta2-left-label: "📁 Files"
          meta2-left-value: "${{ steps.detect.outputs.file_count }} files"
          meta2-right-label: "📊 Changes"
          meta2-right-value: "${{ steps.detect.outputs.changes_text }}"
          content: |
            ${{ steps.detect.outputs.file_details }}
            ${{ steps.detect.outputs.action_items }}
            **CC:** ${{ steps.detect.outputs.unique_roles }}
          buttons: '[{"text":"📄 View Changes","url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}","type":"primary"},{"text":"📋 View Commit","url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}","type":"default"}]'

      # ──────────────────────────────────────
      # Card Type 2: Design only
      # ──────────────────────────────────────
      - name: "Notify Lark — Design Updated"
        if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.only_design == 'true'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "🎨 Design Updated"
          template: 'blue'
          meta-left-label: "👤 Author"
          meta-left-value: "${{ github.actor }}"
          meta-right-label: "🌿 Branch"
          meta-right-value: "${{ github.ref_name }}"
          meta2-left-label: "📁 Files"
          meta2-left-value: "${{ steps.detect.outputs.file_count }} files"
          meta2-right-label: "📊 Changes"
          meta2-right-value: "${{ steps.detect.outputs.changes_text }}"
          content: |
            ${{ steps.detect.outputs.file_details }}
            ${{ steps.detect.outputs.action_items }}
            **CC:** ${{ steps.detect.outputs.unique_roles }}
          buttons: '[{"text":"🎨 View Design","url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}","type":"primary"},{"text":"📋 View Commit","url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}","type":"default"}]'

      # ──────────────────────────────────────
      # Card Type 3: Mixed / other doc types
      # ──────────────────────────────────────
      - name: "Notify Lark — Docs Updated (mixed)"
        if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.only_prd_stories != 'true' && steps.detect.outputs.only_design != 'true'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "📚 Docs Updated — ${{ steps.detect.outputs.categories }}"
          template: 'purple'
          meta-left-label: "👤 Author"
          meta-left-value: "${{ github.actor }}"
          meta-right-label: "🌿 Branch"
          meta-right-value: "${{ github.ref_name }}"
          meta2-left-label: "📁 Files"
          meta2-left-value: "${{ steps.detect.outputs.file_count }} files"
          meta2-right-label: "📊 Changes"
          meta2-right-value: "${{ steps.detect.outputs.changes_text }}"
          content: |
            ${{ steps.detect.outputs.file_details }}
            ${{ steps.detect.outputs.action_items }}
            **CC:** ${{ steps.detect.outputs.unique_roles }}
          buttons: '[{"text":"📄 View All Changes","url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}","type":"primary"},{"text":"📋 Commit","url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}","type":"default"}]'
