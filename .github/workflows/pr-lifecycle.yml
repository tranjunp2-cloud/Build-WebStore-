# PR Lifecycle — Full PR automation (notify, assign, remind, stale check)
name: PR Lifecycle

on:
  pull_request:
    types: [opened, closed, review_requested]
  pull_request_review:
    types: [submitted]
  schedule:
    # Every 4 hours, weekdays only (UTC) — stale/reminder checks
    - cron: '0 */4 * * 1-5'

jobs:
  # ──────────────────────────────────────
  # PR Opened — Notify team + auto-label size
  # ──────────────────────────────────────
  pr-opened:
    name: 'PR Opened'
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4

      - name: Auto-assign author + label + detect type
        uses: actions/github-script@v7
        id: size
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ── 1. Auto-assign PR author ──
            await github.rest.issues.addAssignees({
              owner, repo,
              issue_number: prNumber,
              assignees: [pr.user.login],
            });

            // ── 2. Get changed files + compute size ──
            const { data: files } = await github.rest.pulls.listFiles({
              owner, repo,
              pull_number: prNumber,
            });

            const changes = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            let sizeLabel = 'size:S';
            if (changes > 500) sizeLabel = 'size:XL';
            else if (changes > 200) sizeLabel = 'size:L';
            else if (changes > 50) sizeLabel = 'size:M';

            // ── 3. Auto-detect type labels from branch name ──
            const branch = pr.head.ref;
            const labels = [sizeLabel];

            if (branch.startsWith('feature/')) labels.push('type:feature');
            else if (branch.startsWith('fix/')) labels.push('type:fix');
            else if (branch.startsWith('hotfix/')) labels.push('type:hotfix');
            else if (branch.startsWith('chore/')) labels.push('type:chore');
            else if (branch.startsWith('docs/')) labels.push('type:docs');
            else if (branch.startsWith('refactor/')) labels.push('type:refactor');

            // ── 4. Auto-detect area labels from changed files ──
            const paths = files.map(f => f.filename);
            const areas = new Set();

            for (const p of paths) {
              if (p.startsWith('src/app/') || p.startsWith('src/components/') || p.startsWith('src/blocks/') || p.startsWith('src/store/')) areas.add('area:frontend');
              if (p.startsWith('src/collections/') || p.startsWith('src/app/api/') || p === 'src/payload.config.ts') areas.add('area:backend');
              if (p.startsWith('.github/') || p.startsWith('Dockerfile') || p.startsWith('docker-compose') || p.startsWith('scripts/')) areas.add('area:infra');
              if (p.startsWith('docs/') || p === 'SPEC.md' || p === 'CLAUDE.md') areas.add('area:docs');
            }

            for (const area of areas) labels.push(area);

            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: prNumber,
              labels,
            });

            core.setOutput('size_label', sizeLabel);
            core.setOutput('changes', changes);
            core.setOutput('file_count', files.length);
            core.setOutput('labels', labels.join(', '));

      - name: Notify Lark (PR Opened)
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "\uD83C\uDD95 New PR #${{ github.event.pull_request.number }}"
          template: 'blue'
          meta-left-label: "\uD83D\uDCE6 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "\uD83C\uDF3F Branch"
          meta-right-value: "${{ github.event.pull_request.head.ref }} \u2192 ${{ github.event.pull_request.base.ref }}"
          meta2-left-label: "\uD83D\uDCCA Size"
          meta2-left-value: "${{ steps.size.outputs.size_label }} (${{ steps.size.outputs.changes }} lines)"
          meta2-right-label: "\uD83D\uDC64 Author"
          meta2-right-value: "${{ github.event.pull_request.user.login }}"
          content: |
            \uD83D\uDCDD ${{ github.event.pull_request.title }}
            \uD83D\uDCC1 ${{ steps.size.outputs.file_count }} files changed
          buttons: '[{"text":"\uD83D\uDD0D Review PR","url":"${{ github.event.pull_request.html_url }}","type":"primary"},{"text":"\uD83D\uDCC4 View Files","url":"${{ github.event.pull_request.html_url }}/files","type":"default"}]'

  # ──────────────────────────────────────
  # PR Review Submitted — Notify on approve or changes requested
  # ──────────────────────────────────────
  pr-review:
    name: 'PR Review'
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4

      - name: Notify Lark (Approved)
        if: github.event.review.state == 'approved'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "\u2705 PR Approved #${{ github.event.pull_request.number }}"
          template: 'green'
          meta-left-label: "\uD83D\uDCE6 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "\u2705 Reviewer"
          meta-right-value: "${{ github.event.review.user.login }}"
          content: |
            \uD83D\uDCDD ${{ github.event.pull_request.title }}
            \uD83D\uDC64 Author: ${{ github.event.pull_request.user.login }}
            \uD83C\uDF89 **Ready to merge!**
          buttons: '[{"text":"\uD83D\uDD17 View PR","url":"${{ github.event.pull_request.html_url }}","type":"primary"}]'

      - name: Notify Lark (Changes Requested)
        if: github.event.review.state == 'changes_requested'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "\u26A0\uFE0F Changes Requested #${{ github.event.pull_request.number }}"
          template: 'yellow'
          meta-left-label: "\uD83D\uDCE6 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "\uD83D\uDC40 Reviewer"
          meta-right-value: "${{ github.event.review.user.login }}"
          content: |
            \uD83D\uDCDD ${{ github.event.pull_request.title }}
            \uD83D\uDC64 Author: ${{ github.event.pull_request.user.login }}
            \u26A0\uFE0F Please address review feedback.
          buttons: '[{"text":"\uD83D\uDCDD View Review","url":"${{ github.event.review.html_url }}","type":"primary"}]'

  # ──────────────────────────────────────
  # PR Merged — Notify team
  # ──────────────────────────────────────
  pr-merged:
    name: 'PR Merged'
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4

      - name: Notify Lark (Merged)
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "\uD83C\uDF89 PR Merged #${{ github.event.pull_request.number }}"
          template: 'green'
          meta-left-label: "\uD83D\uDCE6 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "\uD83C\uDFAF Target"
          meta-right-value: "${{ github.event.pull_request.base.ref }}"
          meta2-left-label: "\uD83D\uDD16 Merge"
          meta2-left-value: "${{ github.event.pull_request.merge_commit_sha }}"
          meta2-right-label: "\uD83D\uDC64 Author"
          meta2-right-value: "${{ github.event.pull_request.user.login }}"
          content: |
            \uD83D\uDCDD ${{ github.event.pull_request.title }}
          buttons: '[{"text":"\uD83D\uDD17 View PR","url":"${{ github.event.pull_request.html_url }}","type":"primary"}]'

  # ──────────────────────────────────────
  # Stale PR Check — Remind reviewers and authors
  # ──────────────────────────────────────
  stale-pr-check:
    name: 'Stale PR Check'
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4

      - name: Check for stale PRs
        uses: actions/github-script@v7
        id: stale
        with:
          script: |
            const now = new Date();
            const FOUR_HOURS = 4 * 60 * 60 * 1000;
            const FIVE_DAYS = 5 * 24 * 60 * 60 * 1000;
            const MAX_NOTIFICATIONS = 5;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'asc',
              per_page: 30,
            });

            const needsReview = [];
            const stale = [];

            for (const pr of prs) {
              if (pr.draft) continue;

              const updatedAt = new Date(pr.updated_at);
              const timeSinceUpdate = now - updatedAt;

              if (pr.requested_reviewers.length > 0 && timeSinceUpdate > FOUR_HOURS) {
                const reviewers = pr.requested_reviewers.map(r => r.login).join(', ');
                needsReview.push(`#${pr.number} "${pr.title}" \u2014 waiting: ${reviewers}`);
              }

              if (timeSinceUpdate > FIVE_DAYS) {
                stale.push(`#${pr.number} "${pr.title}" by ${pr.user.login} \u2014 ${Math.floor(timeSinceUpdate / (24*60*60*1000))}d inactive`);
              }
            }

            let content = '';

            if (needsReview.length > 0) {
              const items = needsReview.slice(0, MAX_NOTIFICATIONS).join('\n');
              content += `**\u23F3 Pending Review (>4h):**\n${items}\n\n`;
            }

            if (stale.length > 0) {
              const items = stale.slice(0, MAX_NOTIFICATIONS).join('\n');
              content += `**\uD83D\uDD78\uFE0F Stale PRs (>5 days):**\n${items}`;
            }

            core.setOutput('has_issues', content.length > 0 ? 'true' : 'false');
            core.setOutput('content', content);
            core.setOutput('count', needsReview.length + stale.length);

      - name: Notify Lark (Stale PRs)
        if: steps.stale.outputs.has_issues == 'true'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_TASK || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_TASK || '' }}
          title: "\u23F0 Stale PR Alert \u2014 ${{ steps.stale.outputs.count }} items"
          template: 'yellow'
          meta-left-label: "\uD83D\uDCE6 Repo"
          meta-left-value: "PrimeWeb"
          meta-right-label: "\uD83D\uDCCA Total"
          meta-right-value: "${{ steps.stale.outputs.count }} items"
          content: ${{ steps.stale.outputs.content }}
          buttons: '[{"text":"\uD83D\uDCCB View Open PRs","url":"${{ github.server_url }}/${{ github.repository }}/pulls","type":"primary"}]'
