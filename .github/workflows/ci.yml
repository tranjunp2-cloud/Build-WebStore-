# CI Pipeline — Lint, typecheck, test, build, quality metrics
# PR → CI (+ quality comment) → Deploy Preview
# Push → CI → Deploy Staging/Production → Lark notify
#
# 💡 Cost optimization (GitHub Team = 3,000 min/month free):
# - Skip CI for docs/workflow/story-only changes (saves ~30% minutes)
# - Docker build only when Dockerfile or config changes (saves ~90s/PR)
# - Push to staging skips CI if PR already passed (deploy only)
name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CONTRIBUTING.md'
      - '.github/GIT_AND_CI_RULES.md'
      - '.github/pull_request_template.md'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CONTRIBUTING.md'
      - '.github/GIT_AND_CI_RULES.md'
      - '.github/pull_request_template.md'
      - '*.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────
  # Job 1: CI — Lint, Typecheck, Test, Build + Quality Metrics (PR)
  # ──────────────────────────────────────
  ci:
    name: "CI: Lint → Typecheck → Test → Build"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check DB migrations
        if: github.event_name == 'pull_request'
        id: migrations
        run: |
          git fetch origin staging --depth=1
          node scripts/check-migrations.js origin/staging

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Test
        id: test
        run: npm run test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3

      - name: Build
        id: build
        env:
          NODE_OPTIONS: '--require ./node-polyfill.js'
        run: npm run build 2>&1 | tee build-output.txt

      # --- Docker Build Verification (PR only, when relevant files change) ---
      # Only runs when Dockerfile, config, or dependency files change.
      # Saves ~90-120s per PR that doesn't touch deploy-relevant files.
      - name: Check if Docker build needed
        if: success() && github.event_name == 'pull_request'
        id: docker_check
        run: |
          DOCKER_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            Dockerfile \
            docker-compose*.yml \
            package.json \
            package-lock.json \
            next.config.ts \
            next.config.mjs \
            node-polyfill.js \
            tsconfig.json \
            'src/app/**/page.tsx' \
            'src/app/**/layout.tsx' \
            2>/dev/null || echo "")
          if [ -n "$DOCKER_FILES" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "🐳 Docker build needed — changed: $DOCKER_FILES"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Docker build skipped — no deploy-relevant changes"
          fi

      - name: Docker build check
        if: success() && github.event_name == 'pull_request' && steps.docker_check.outputs.needed == 'true'
        id: docker
        run: |
          echo "🐳 Building Docker image (builder stage) to verify deploy compatibility..."
          docker build \
            --target builder \
            -t primeweb-ci-check:${{ github.sha }} \
            . 2>&1 | tee docker-build-output.txt
          echo "✅ Docker build passed — deploy will succeed on DO"

      # --- Quality Metrics: Coverage + Bundle Size (PR only) ---
      - name: Parse coverage report
        if: success() && github.event_name == 'pull_request'
        id: coverage
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            LINES=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.branches.pct)")
            FUNCTIONS=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.functions.pct)")
            STATEMENTS=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.statements.pct)")
          else
            LINES="N/A"; BRANCHES="N/A"; FUNCTIONS="N/A"; STATEMENTS="N/A"
          fi
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "statements=$STATEMENTS" >> "$GITHUB_OUTPUT"

      - name: Measure bundle size
        if: success() && github.event_name == 'pull_request'
        id: bundle
        run: |
          if [ -d ".next" ]; then
            TOTAL_SIZE=$(du -sh .next/ 2>/dev/null | cut -f1 || echo "N/A")
            FIRST_LOAD=$(grep -oP 'First Load JS shared by all\s+\K[\d.]+ [kKmM]?B' build-output.txt 2>/dev/null || echo "N/A")
            [ -z "$FIRST_LOAD" ] && FIRST_LOAD="N/A"
          else
            TOTAL_SIZE="N/A"; FIRST_LOAD="N/A"
          fi
          echo "total_size=$TOTAL_SIZE" >> "$GITHUB_OUTPUT"
          echo "first_load=$FIRST_LOAD" >> "$GITHUB_OUTPUT"

      - name: Comment quality metrics on PR
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = {
              lines: '${{ steps.coverage.outputs.lines }}',
              branches: '${{ steps.coverage.outputs.branches }}',
              functions: '${{ steps.coverage.outputs.functions }}',
              statements: '${{ steps.coverage.outputs.statements }}',
            };
            const bundle = {
              totalSize: '${{ steps.bundle.outputs.total_size }}',
              firstLoad: '${{ steps.bundle.outputs.first_load }}',
            };

            const marker = '<!-- quality-metrics -->';
            const body = [
              marker,
              '## 📊 Quality Metrics',
              '',
              '### Test Coverage',
              '| Metric | Value |',
              '|--------|-------|',
              `| Lines | ${coverage.lines}% |`,
              `| Branches | ${coverage.branches}% |`,
              `| Functions | ${coverage.functions}% |`,
              `| Statements | ${coverage.statements}% |`,
              '',
              '### Bundle Size',
              '| Asset | Size |',
              '|-------|------|',
              `| Total (.next/) | ${bundle.totalSize} |`,
              `| First Load JS | ${bundle.firstLoad} |`,
              '',
              '---',
              `_Updated: ${new Date().toISOString()} | [View CI Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body,
              });
            }

      # --- Notification: CI Failed (push or PR) ---
      # Only notify on failure — CI pass is silent (deploy job will notify)
      - name: Prepare failure info
        if: failure()
        id: fail_info
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker.outcome }}
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --format='%s' -n 1 | head -c 80)" >> "$GITHUB_OUTPUT"

          LINT_ICON="✅"; TC_ICON="✅"; TEST_ICON="✅"; BUILD_ICON="⬜"; DOCKER_ICON="⬜"
          FAILED=""
          if [ "$LINT_OUTCOME" = "failure" ]; then LINT_ICON="❌"; FAILED="Lint"; fi
          if [ "$TYPECHECK_OUTCOME" = "failure" ]; then TC_ICON="❌"; FAILED="TypeCheck"; fi
          if [ "$TEST_OUTCOME" = "failure" ]; then TEST_ICON="❌"; FAILED="Test"; fi
          if [ "$BUILD_OUTCOME" = "failure" ]; then BUILD_ICON="❌"; FAILED="Build"; fi
          if [ "$DOCKER_OUTCOME" = "failure" ]; then DOCKER_ICON="❌"; FAILED="Docker"; fi
          if [ -z "$TYPECHECK_OUTCOME" ] || [ "$TYPECHECK_OUTCOME" = "skipped" ]; then TC_ICON="⬜"; fi
          if [ -z "$TEST_OUTCOME" ] || [ "$TEST_OUTCOME" = "skipped" ]; then TEST_ICON="⬜"; fi
          if [ -z "$BUILD_OUTCOME" ] || [ "$BUILD_OUTCOME" = "skipped" ]; then BUILD_ICON="⬜"; fi
          if [ -z "$DOCKER_OUTCOME" ] || [ "$DOCKER_OUTCOME" = "skipped" ]; then DOCKER_ICON="⬜"; fi

          echo "failed_step=$FAILED" >> "$GITHUB_OUTPUT"
          echo "status_line=Lint ${LINT_ICON}  TypeCheck ${TC_ICON}  Test ${TEST_ICON}  Build ${BUILD_ICON}  Docker ${DOCKER_ICON}" >> "$GITHUB_OUTPUT"

      - name: Notify CI Failed
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          lark-webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          lark-sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          event: 'ci_fail'
          branch: ${{ github.ref_name }}
          author: ${{ github.actor }}
          commit-sha: ${{ steps.fail_info.outputs.short_sha }}
          commit-msg: ${{ steps.fail_info.outputs.commit_msg }}
          ci-status: ${{ steps.fail_info.outputs.status_line }}
          failed-step: ${{ steps.fail_info.outputs.failed_step }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────
  # Job 2: Deploy Staging (push to staging, after CI passes)
  # ──────────────────────────────────────
  deploy-staging:
    name: "Deploy: Staging [2/2]"
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Sync env vars to DO before deploying ─────────────────────────────
      # Uses DO REST API directly (not doctl CLI) to sync GitHub Secrets → DO App env vars.
      # To add/update a secret: update GitHub Secrets → push to staging → auto-synced.
      - name: Sync env vars → DO App (staging)
        env:
          DIGITALOCEAN_ACCESS_TOKEN:            ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PAYLOAD_SECRET:                     ${{ secrets.PAYLOAD_SECRET }}
          STRIPE_SECRET_KEY:                  ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:              ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          OPENAI_API_KEY:                     ${{ secrets.OPENAI_API_KEY }}
          S3_ENDPOINT:                        ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID:                   ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY:               ${{ secrets.S3_SECRET_ACCESS_KEY }}
          LARK_APP_ID:                        ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET:                    ${{ secrets.LARK_APP_SECRET }}
          LARK_ENCRYPT_KEY:                   ${{ secrets.LARK_ENCRYPT_KEY }}
          LARK_VERIFICATION_TOKEN:            ${{ secrets.LARK_VERIFICATION_TOKEN }}
          LARK_BOT_OPEN_ID:                   ${{ secrets.LARK_BOT_OPEN_ID }}
          # Note: GH_BOT_TOKEN (not GITHUB_TOKEN — that's a built-in GHA var)
          GH_BOT_TOKEN:                       ${{ secrets.GH_BOT_TOKEN }}
          MAIL_USERNAME:                      ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD:                      ${{ secrets.MAIL_PASSWORD }}
          ECH_DISTRIBUTION_API_URL:           ${{ secrets.ECH_DISTRIBUTION_API_URL }}
          ECH_DISTRIBUTION_API_KEY:           ${{ secrets.ECH_DISTRIBUTION_API_KEY }}
        run: python3 .github/scripts/sync-do-envs.py ech-prime-web-v2-staging
      # ─────────────────────────────────────────────────────────────────────

      - name: Deploy to DigitalOcean App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: ech-prime-web-v2-staging
          print_build_logs: "true"
          print_deploy_logs: "true"

      - name: Prepare deploy info
        if: always()
        id: info
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --format='%s' -n 1 | head -c 80)" >> "$GITHUB_OUTPUT"

      - name: Notify — Staging Deploy Result
        if: always()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          lark-webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          lark-sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          event: ${{ steps.deploy.outcome == 'success' && 'deploy_success' || 'deploy_fail' }}
          branch: staging
          environment: staging
          author: ${{ github.actor }}
          commit-sha: ${{ steps.info.outputs.short_sha }}
          commit-msg: ${{ steps.info.outputs.commit_msg }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────
  # Job 2.5: E2E Tests (after staging deploy)
  # Runs Java Playwright tests against live staging
  # ──────────────────────────────────────
  e2e-test:
    name: "E2E: Automated QA"
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for staging to be ready
        run: |
          STAGING_URL="${{ vars.STAGING_URL || 'https://ech-prime-web-v2-staging-pzdwc.ondigitalocean.app' }}"
          echo "Waiting for staging to be ready at $STAGING_URL..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL" --max-time 10 || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ]; then
              echo "✅ Staging is ready (HTTP $STATUS)"
              exit 0
            fi
            echo "  Attempt $i: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "❌ Staging not ready after 5 minutes"
          exit 1

      - name: Run E2E tests
        working-directory: docs/qa/qa-automation
        env:
          BASE_URL: ${{ vars.STAGING_URL || 'https://ech-prime-web-v2-staging-pzdwc.ondigitalocean.app' }}
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL || 'phuong.ltweb@gmail.com' }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD || 'Aa123456@' }}
          HEADLESS: 'true'
          CI: 'true'
        run: |
          # Install Playwright browsers
          mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium" 2>/dev/null || true
          # Run tests
          mvn test -Dheadless=true 2>&1 | tee e2e-output.log
          echo "E2E_EXIT_CODE=$?" >> "$GITHUB_ENV"

      - name: Parse test results
        if: always()
        id: results
        working-directory: docs/qa/qa-automation
        run: |
          if [ -f target/surefire-reports/TEST-*.xml ]; then
            TOTAL=$(grep -r 'tests=' target/surefire-reports/TEST-*.xml | grep -oP 'tests="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "0")
            FAILURES=$(grep -r 'failures=' target/surefire-reports/TEST-*.xml | grep -oP 'failures="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "0")
            ERRORS=$(grep -r 'errors=' target/surefire-reports/TEST-*.xml | grep -oP 'errors="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "0")
            PASSED=$((TOTAL - FAILURES - ERRORS))
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
            echo "failed=$((FAILURES + ERRORS))" >> "$GITHUB_OUTPUT"
          else
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_number }}
          path: |
            docs/qa/qa-automation/target/surefire-reports/
            docs/qa/qa-automation/e2e-output.log
          retention-days: 14

      - name: Notify — E2E Results
        if: always()
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "${{ job.status == 'success' && '✅ E2E Tests Passed' || '❌ E2E Tests Failed' }}"
          status: "${{ job.status }}"
          content: |
            🧪 **E2E Results:** ${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }} passed
            ${{ steps.results.outputs.failed != '0' && format('❌ {0} tests failed', steps.results.outputs.failed) || '✅ All tests passed — QC bắt đầu UAT' }}
          meta-left-label: "📦 Branch"
          meta-left-value: "staging"
          meta-right-label: "🧪 Tests"
          meta-right-value: "${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }}"
          buttons: '[{"text":"📋 View Report","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","type":"primary"},{"text":"🧪 QA Board","url":"${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aopen+label%3Aqa%3Apending","type":"default"}]'

  # ──────────────────────────────────────
  # Job 3: Deploy Production (push to main, after CI passes)
  # ──────────────────────────────────────
  deploy-production:
    name: "Deploy: Production [2/2]"
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: ech-prime-web-v2
          print_build_logs: "true"
          print_deploy_logs: "true"

      - name: Prepare deploy info
        if: always()
        id: info
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --format='%s' -n 1 | head -c 80)" >> "$GITHUB_OUTPUT"

      - name: Notify — Production Deploy Result
        if: always()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          lark-webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          lark-sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          event: ${{ steps.deploy.outcome == 'success' && 'deploy_success' || 'deploy_fail' }}
          branch: main
          environment: production
          author: ${{ github.actor }}
          commit-sha: ${{ steps.info.outputs.short_sha }}
          commit-msg: ${{ steps.info.outputs.commit_msg }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          staging-url: https://echprime.com

  # ──────────────────────────────────────
  # Job 4: Deploy Preview — DISABLED
  # Reason: Each PR preview creates a new DO app + dev database ($$$).
  # The delete-preview workflow fails to clean up orphaned apps.
  # Use staging deploy instead — merge PR to staging for testing.
  # Re-enable when DO fixes preview app cleanup or we switch to Vercel previews.
  # ──────────────────────────────────────
