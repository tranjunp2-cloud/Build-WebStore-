# CI — Lint, typecheck, test, build
# Chạy trên: PR vào main/staging, push lên main/staging
# Thông báo Lark khi fail
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        env:
          NODE_OPTIONS: '--require ./node-polyfill.js'
        run: npm run build

      # --- Lark Notifications ---
      - name: Notify Lark (Success)
        if: success() && github.event_name == 'push'
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_SIGN_KEY: ${{ secrets.LARK_SIGN_KEY }}
        run: |
          TIMESTAMP=$(date +%s)
          SIGN=$(echo -n "" | openssl dgst -sha256 -hmac "$(printf '%s\n%s' "$TIMESTAMP" "$LARK_SIGN_KEY")" -binary | base64 2>/dev/null || echo "")
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          AUTHOR="${GITHUB_ACTOR}"
          TIME=$(date -u +"%H:%M UTC")
          curl -s -X POST "$LARK_WEBHOOK" -H 'Content-Type: application/json' -d '{
            "timestamp": "'"$TIMESTAMP"'",
            "sign": "'"$SIGN"'",
            "msg_type": "interactive",
            "card": {
              "header": {"title": {"tag": "plain_text", "content": "✅ CI Passed"}, "template": "green"},
              "elements": [
                {"tag": "column_set", "flex_mode": "none", "background_style": "default", "columns": [
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**📦 Project**\nPrimeWeb"}}]},
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**🌿 Branch**\n'"$BRANCH"'"}}]}
                ]},
                {"tag": "column_set", "flex_mode": "none", "background_style": "default", "columns": [
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**🔖 Commit**\n'"$SHORT_SHA"'"}}]},
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**👤 Author**\n'"$AUTHOR"'"}}]}
                ]},
                {"tag": "hr"},
                {"tag": "div", "text": {"tag": "lark_md", "content": "🕐 '"$TIME"'  ·  Lint ✅  TypeCheck ✅  Test ✅  Build ✅"}},
                {"tag": "action", "actions": [{"tag": "button", "text": {"tag": "plain_text", "content": "📋 View CI Run"}, "url": "'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'", "type": "primary"}]}
              ]
            }
          }' || true

      - name: Notify Lark (Failure)
        if: failure()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_SIGN_KEY: ${{ secrets.LARK_SIGN_KEY }}
        run: |
          TIMESTAMP=$(date +%s)
          SIGN=$(echo -n "" | openssl dgst -sha256 -hmac "$(printf '%s\n%s' "$TIMESTAMP" "$LARK_SIGN_KEY")" -binary | base64 2>/dev/null || echo "")
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          AUTHOR="${GITHUB_ACTOR}"
          TIME=$(date -u +"%H:%M UTC")
          EVENT_TYPE="${GITHUB_EVENT_NAME}"
          if [ "$EVENT_TYPE" = "pull_request" ]; then
            TITLE="❌ CI Failed — PR #${{ github.event.pull_request.number }}"
            URL="${{ github.event.pull_request.html_url }}"
          else
            TITLE="❌ CI Failed — $BRANCH"
            URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          curl -s -X POST "$LARK_WEBHOOK" -H 'Content-Type: application/json' -d '{
            "timestamp": "'"$TIMESTAMP"'",
            "sign": "'"$SIGN"'",
            "msg_type": "interactive",
            "card": {
              "header": {"title": {"tag": "plain_text", "content": "'"$TITLE"'"}, "template": "red"},
              "elements": [
                {"tag": "column_set", "flex_mode": "none", "background_style": "default", "columns": [
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**📦 Project**\nPrimeWeb"}}]},
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**🌿 Branch**\n'"$BRANCH"'"}}]}
                ]},
                {"tag": "column_set", "flex_mode": "none", "background_style": "default", "columns": [
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**🔖 Commit**\n'"$SHORT_SHA"'"}}]},
                  {"tag": "column", "width": "weighted", "weight": 1, "vertical_align": "top", "elements": [{"tag": "div", "text": {"tag": "lark_md", "content": "**👤 Author**\n'"$AUTHOR"'"}}]}
                ]},
                {"tag": "hr"},
                {"tag": "div", "text": {"tag": "lark_md", "content": "⚠️ **CI pipeline failed!** Please check the logs and fix the issues."}},
                {"tag": "div", "text": {"tag": "lark_md", "content": "🕐 '"$TIME"'"}},
                {"tag": "action", "actions": [{"tag": "button", "text": {"tag": "plain_text", "content": "🔍 View Logs"}, "url": "'"$URL"'", "type": "danger"}]}
              ]
            }
          }' || true
