# CI Pipeline — Lint, typecheck, test, build
# PR → CI → Deploy Preview (sequential)
# Push → CI → Lark notify
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────
  # Job 1: CI — Lint, Typecheck, Test, Build
  # ──────────────────────────────────────
  ci:
    name: "CI: Lint → Typecheck → Test → Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Test
        id: test
        run: npm run test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3

      - name: Build
        id: build
        env:
          NODE_OPTIONS: '--require ./node-polyfill.js'
        run: npm run build

      # --- Lark: CI Passed ---
      - name: Prepare CI status
        if: success() && github.event_name == 'push'
        id: ci_info
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --format='%s' -n 1 | head -c 80)" >> "$GITHUB_OUTPUT"

      - name: Notify Lark (CI Passed)
        if: success() && github.event_name == 'push'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "✅ CI Passed — ${{ github.ref_name }}"
          template: 'green'
          meta-left-label: "📦 Project"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌿 Branch"
          meta-right-value: "${{ github.ref_name }}"
          meta2-left-label: "🔖 Commit"
          meta2-left-value: "${{ steps.ci_info.outputs.short_sha }}"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.actor }}"
          content: |
            📝 ${{ steps.ci_info.outputs.commit_msg }}
            **Pipeline [1/2]** CI
            Lint ✅  TypeCheck ✅  Test ✅  Build ✅
          buttons: '[{"text":"📋 View CI Run","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","type":"primary"},{"text":"📄 View Diff","url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}","type":"default"}]'

      # --- Lark: CI Failed ---
      - name: Prepare failure info
        if: failure()
        id: fail_info
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --format='%s' -n 1 | head -c 80)" >> "$GITHUB_OUTPUT"

          # Determine icons
          LINT_ICON="✅"; TC_ICON="✅"; TEST_ICON="✅"; BUILD_ICON="⬜"
          FAILED=""
          if [ "$LINT_OUTCOME" = "failure" ]; then LINT_ICON="❌"; FAILED="Lint"; fi
          if [ "$TYPECHECK_OUTCOME" = "failure" ]; then TC_ICON="❌"; FAILED="TypeCheck"; fi
          if [ "$TEST_OUTCOME" = "failure" ]; then TEST_ICON="❌"; FAILED="Test"; fi
          if [ "$BUILD_OUTCOME" = "failure" ]; then BUILD_ICON="❌"; FAILED="Build"; fi
          if [ -z "$TYPECHECK_OUTCOME" ] || [ "$TYPECHECK_OUTCOME" = "skipped" ]; then TC_ICON="⬜"; fi
          if [ -z "$TEST_OUTCOME" ] || [ "$TEST_OUTCOME" = "skipped" ]; then TEST_ICON="⬜"; fi
          if [ -z "$BUILD_OUTCOME" ] || [ "$BUILD_OUTCOME" = "skipped" ]; then BUILD_ICON="⬜"; fi

          echo "failed_step=$FAILED" >> "$GITHUB_OUTPUT"
          echo "status_line=Lint ${LINT_ICON}  TypeCheck ${TC_ICON}  Test ${TEST_ICON}  Build ${BUILD_ICON}" >> "$GITHUB_OUTPUT"

      - name: Notify Lark (CI Failed — push)
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "❌ CI Failed — ${{ github.ref_name }}"
          template: 'red'
          meta-left-label: "📦 Project"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌿 Branch"
          meta-right-value: "${{ github.ref_name }}"
          meta2-left-label: "🔖 Commit"
          meta2-left-value: "${{ steps.fail_info.outputs.short_sha }}"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.actor }}"
          content: |
            📝 ${{ steps.fail_info.outputs.commit_msg }}

            ⚠️ **Failed at: ${{ steps.fail_info.outputs.failed_step }}**
            ${{ steps.fail_info.outputs.status_line }}
          buttons: '[{"text":"🔍 View Logs","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","type":"danger"}]'

      - name: Notify Lark (CI Failed — PR)
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "❌ CI Failed — PR #${{ github.event.pull_request.number }}"
          template: 'red'
          meta-left-label: "📦 Project"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌿 Branch"
          meta-right-value: "${{ github.head_ref }}"
          meta2-left-label: "🔖 Commit"
          meta2-left-value: "${{ steps.fail_info.outputs.short_sha }}"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.actor }}"
          content: |
            📝 ${{ github.event.pull_request.title }}

            ⚠️ **Failed at: ${{ steps.fail_info.outputs.failed_step }}**
            ${{ steps.fail_info.outputs.status_line }}
          buttons: '[{"text":"🔍 View Logs","url":"${{ github.event.pull_request.html_url }}","type":"danger"}]'

  # ──────────────────────────────────────
  # Job 2: Deploy Preview (PR only, after CI passes)
  # ──────────────────────────────────────
  deploy-preview:
    name: "Preview: Deploy PR"
    needs: ci
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy preview app
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          deploy_pr_preview: "true"
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Comment preview URL on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const app = ${{ steps.deploy.outputs.app }};
            const liveUrl = app.live_url;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed!**\n\n🔗 **URL:** ${liveUrl}\n\n---\n_Deployed from commit ${context.sha.substring(0, 7)}_`
            });

      # --- Lark: Preview Deployed ---
      - name: Notify Lark (Preview Deployed)
        if: success()
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "🔍 Preview Deployed — PR #${{ github.event.pull_request.number }}"
          template: 'blue'
          meta-left-label: "📦 Project"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌍 Environment"
          meta-right-value: "Preview"
          meta2-left-label: "🔖 Commit"
          meta2-left-value: "${{ github.sha }}"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.actor }}"
          content: |
            📝 ${{ github.event.pull_request.title }}
            **Pipeline [2/2]** Preview Deploy
            CI ✅  Preview ✅
          buttons: '[{"text":"🔗 View PR","url":"${{ github.event.pull_request.html_url }}","type":"primary"},{"text":"🔍 View Preview","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","type":"default"}]'

      - name: Comment failure on PR
        if: failure()
        uses: actions/github-script@v7
        env:
          BUILD_LOGS: ${{ steps.deploy.outputs.build_logs }}
          DEPLOY_LOGS: ${{ steps.deploy.outputs.deploy_logs }}
        with:
          script: |
            const { BUILD_LOGS, DEPLOY_LOGS } = process.env;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Preview deploy failed.**\n\n[View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n<details>\n<summary>Build logs</summary>\n\n\`\`\`\n${BUILD_LOGS}\n\`\`\`\n</details>\n\n<details>\n<summary>Deploy logs</summary>\n\n\`\`\`\n${DEPLOY_LOGS}\n\`\`\`\n</details>`
            });

      # --- Lark: Preview Failed ---
      - name: Notify Lark (Preview Failed)
        if: failure()
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "❌ Preview Failed — PR #${{ github.event.pull_request.number }}"
          template: 'red'
          meta-left-label: "📦 Project"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌍 Environment"
          meta-right-value: "Preview"
          meta2-left-label: "🔖 Commit"
          meta2-left-value: "${{ github.sha }}"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.actor }}"
          content: |
            📝 ${{ github.event.pull_request.title }}
            ⚠️ **Preview deploy failed at step [2/2].**
          buttons: '[{"text":"🔍 View Logs","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","type":"danger"},{"text":"🔗 View PR","url":"${{ github.event.pull_request.html_url }}","type":"default"}]'
