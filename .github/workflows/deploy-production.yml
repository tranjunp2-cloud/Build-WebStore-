# Deploy Production — chạy SAU KHI CI pass trên nhánh main
# Pipeline: CI [1/2] → Deploy Production [2/2]
name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: "Deploy: Production [2/2]"
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_OPTIONS: '--require ./node-polyfill.js'
          NEXT_PUBLIC_APP_ENV: production
        run: npm run build

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # --- Prepare info for Lark ---
      - name: Prepare deploy info
        if: always()
        id: info
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --format='%s' -n 1 | head -c 80)" >> "$GITHUB_OUTPUT"

      # --- Lark: Production Deployed ---
      - name: Notify Lark (Production Deployed)
        if: success()
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "🚀 Production Deployed"
          template: 'green'
          meta-left-label: "📦 Project"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌍 Environment"
          meta-right-value: "🔴 Production"
          meta2-left-label: "🔖 Commit"
          meta2-left-value: "${{ steps.info.outputs.short_sha }}"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.event.workflow_run.actor.login }}"
          content: |
            📝 ${{ steps.info.outputs.commit_msg }}
            ⚡ **Production is now live!**
            **Pipeline [2/2]** Production Deploy
            CI ✅  Deploy ✅
          buttons: '[{"text":"📋 View Deploy","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","type":"primary"},{"text":"🌐 Open Production","url":"https://echprime.com","type":"default"}]'

      # --- Lark: Production Deploy Failed ---
      - name: Notify Lark (Production Deploy Failed)
        if: failure()
        uses: ./.github/actions/lark-notify
        with:
          webhook-url: ${{ secrets.LARK_WEBHOOK_CI || secrets.LARK_WEBHOOK_URL }}
          sign-key: ${{ secrets.LARK_SIGN_KEY_CI || secrets.LARK_SIGN_KEY }}
          title: "🚨 Production Deploy FAILED"
          template: 'red'
          meta-left-label: "📦 Project"
          meta-left-value: "PrimeWeb"
          meta-right-label: "🌍 Environment"
          meta-right-value: "🔴 Production"
          meta2-left-label: "🔖 Commit"
          meta2-left-value: "${{ steps.info.outputs.short_sha }}"
          meta2-right-label: "👤 Author"
          meta2-right-value: "${{ github.event.workflow_run.actor.login }}"
          content: |
            📝 ${{ steps.info.outputs.commit_msg }}
            🚨 **CRITICAL: Production deploy failed!**
            ⚠️ Action required immediately!
          buttons: '[{"text":"🔍 View Logs","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","type":"danger"}]'
