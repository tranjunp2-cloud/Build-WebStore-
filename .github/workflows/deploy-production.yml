# Deploy Production — chạy khi push lên nhánh main
# Chỉ chạy sau khi PR đã merge (main protected, CI pass)
# Thông báo Lark khi deploy
name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_OPTIONS: '--require ./node-polyfill.js'
          NEXT_PUBLIC_APP_ENV: production
        run: npm run build

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # --- Lark Notifications ---
      - name: Notify Lark (Production Deployed)
        if: success()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_SIGN_KEY: ${{ secrets.LARK_SIGN_KEY }}
        run: |
          TIMESTAMP=$(date +%s)
          SIGN=$(echo -n "" | openssl dgst -sha256 -hmac "$(printf '%s\n%s' "$TIMESTAMP" "$LARK_SIGN_KEY")" -binary | base64 2>/dev/null || echo "")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          curl -s -X POST "$LARK_WEBHOOK" -H 'Content-Type: application/json' -d '{
            "timestamp": "'"$TIMESTAMP"'",
            "sign": "'"$SIGN"'",
            "msg_type": "interactive",
            "card": {
              "header": {"title": {"tag": "plain_text", "content": "🏭 Production Deployed — PrimeWeb"}, "template": "green"},
              "elements": [
                {"tag": "div", "text": {"tag": "lark_md", "content": "**Environment:** 🔴 Production\n**Commit:** '"$SHORT_SHA"'\n**Author:** '"$GITHUB_ACTOR"'\n\n⚡ Production is now live!"}},
                {"tag": "action", "actions": [{"tag": "button", "text": {"tag": "plain_text", "content": "View Deploy →"}, "url": "'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'", "type": "primary"}]}
              ]
            }
          }' || true

      - name: Notify Lark (Production Deploy Failed)
        if: failure()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_SIGN_KEY: ${{ secrets.LARK_SIGN_KEY }}
        run: |
          TIMESTAMP=$(date +%s)
          SIGN=$(echo -n "" | openssl dgst -sha256 -hmac "$(printf '%s\n%s' "$TIMESTAMP" "$LARK_SIGN_KEY")" -binary | base64 2>/dev/null || echo "")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          curl -s -X POST "$LARK_WEBHOOK" -H 'Content-Type: application/json' -d '{
            "timestamp": "'"$TIMESTAMP"'",
            "sign": "'"$SIGN"'",
            "msg_type": "interactive",
            "card": {
              "header": {"title": {"tag": "plain_text", "content": "🚨 Production Deploy FAILED — PrimeWeb"}, "template": "red"},
              "elements": [
                {"tag": "div", "text": {"tag": "lark_md", "content": "**Environment:** 🔴 Production\n**Commit:** '"$SHORT_SHA"'\n**Author:** '"$GITHUB_ACTOR"'\n\n⚠️ **Action required!** Production deploy failed."}},
                {"tag": "action", "actions": [{"tag": "button", "text": {"tag": "plain_text", "content": "View Logs →"}, "url": "'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'", "type": "danger"}]}
              ]
            }
          }' || true
