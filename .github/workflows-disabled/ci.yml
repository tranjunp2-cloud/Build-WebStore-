# CI Pipeline — quality + test on PRs, CI-driven Vercel deploy on push
#
# PR → staging   → changes + quality + test (affected tests only) + ai-platform-check, by path
# PR → main      → same jobs, full test suite + coverage (release gate)
# Push staging   → deploy-staging                    (via VERCEL_TOKEN)
# Push main      → deploy-production                 (via VERCEL_TOKEN)
#
# Quality/test DO NOT run in this workflow on push — merge commits on staging/main are already
# validated by the PR's own CI run, and this run holds the per-branch concurrency group that keeps
# deploys in push order. Outside this run, after a merge into staging:
#   staging-full-tests.yml — full unit suite (does not block the deploy)
#   e2e-staging.yml        — Playwright on the live deploy (own `push: staging` trigger, unchanged)
#
# Why affected tests on feature PRs: the full suite is 1242 files / ~18k tests and takes ~22 min
# on a 2-CPU runner. unit-tests.yml (mode affected) runs only the specs that import a file the PR
# changed. Everything a feature PR skips still runs after the merge (staging-full-tests.yml) and on
# the staging → main release PR.
#
# Why CI-driven deploy instead of Vercel git webhook:
#   Vercel Pro blocks commits from non-team-members with
#   "commit author does not have contributing access". CI deploys under the
#   token owner's identity, so any team member's push can land.
#   See plans/260413-1126-vercel-deploy-blocked/ for full diagnosis.
#
# Architecture:
#   changes (PR only): which areas the PR touched → web / ai / full
#   quality-check (PR, web): migrations + env manifests + Payload cycles + ESLint + typecheck
#   test (PR, web): unit-tests.yml, affected or full — parallel with quality-check
#   metrics (full runs on PRs only, needs: test): coverage comment
#   ai-platform-check (PR, ai): services/ai-platform install + typecheck + test + build (Node 24)
#   deploy-staging    (push staging, no needs on test — CI already ran on PR)
#   deploy-production (push main,    no needs — CI already ran on PR)
#   deploy-ai-platform            (push staging) — separate Vercel project, same 3-stage flow
#   deploy-ai-platform-production (push main)    — separate Vercel project, same 3-stage flow
#   deploy-scope (push / manual run on staging, main): picks which of the two projects the
#     push changed; the four deploy jobs above run only for their side (manual run = both)
#   notify-fail (PR only, if failure)
#
# Runners: CI_HEAVY_RUNNER (PR checks), CI_DEPLOY_RUNNER (deploy jobs; falls back to
# CI_HEAVY_RUNNER), CI_RUNNER (small jobs). Pointing CI_DEPLOY_RUNNER at a label that only a
# reserved runner carries keeps deploys from queueing behind PR test jobs.
name: CI

on:
  push:
    branches: [main, staging, qc-test]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CONTRIBUTING.md'
      - '.github/GIT_AND_CI_RULES.md'
      - '.github/pull_request_template.md'
      - '*.md'
      - 'LICENSE'
      - 'plans/**'
      - '.claude/**'
      - '.opencode/**'
      - '.cursor/**'
      - '.gemini/**'
  pull_request:
    branches: [main, staging]
    # ready_for_review re-runs CI when a draft is marked ready; drafts
    # themselves are skipped at job level below to save Actions minutes.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CONTRIBUTING.md'
      - '.github/GIT_AND_CI_RULES.md'
      - '.github/pull_request_template.md'
      - '*.md'
      - 'LICENSE'
      - 'plans/**'
      - '.claude/**'
      - '.opencode/**'
      - '.cursor/**'
      - '.gemini/**'
  # Manual dispatch lets sync-staging-to-qc-test.yml re-trigger the
  # deploy-qc-test job after it pushes to qc-test with GITHUB_TOKEN.
  # GITHUB_TOKEN pushes do not fire push events, but workflow_dispatch
  # from another workflow does create a new run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR runs are superseded by newer pushes; pushes to staging/main are never cancelled
  # because their deploy jobs run DB migrations and a mid-flight cancel can leave them half-applied.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ──────────────────────────────────────
  # Job 0: Changes — which areas a PR touched (seconds, light runner)
  # ──────────────────────────────────────
  # The PR merge commit's first parent (HEAD^1) is the base branch tip, so a depth-2 checkout is
  # enough to diff exactly what the PR adds on top of the current base.
  #   web  — anything outside services/ai-platform, docs, plans, AI-tool folders, top-level *.md
  #          and .github/ISSUE_TEMPLATE
  #   ai   — services/ai-platform, packages/agent-core|ai-contracts (linked via file:), core CI files
  #   full — affected mode = `vitest --changed` (import graph) + every spec that reads files or
  #          spawns processes (unit-tests.yml; covers scripts/db-setup.js, vercel.json, locale JSON,
  #          CSS, workflows…). It cannot see what changes every spec at once or what vi.mock()s a
  #          path that no longer exists, so full=true for: a release PR into main; package.json,
  #          lockfile, tsconfig, vitest config, .nvmrc, node-polyfill.js, shared test helpers/mocks;
  #          the CI definition itself (ci.yml, unit-tests.yml, staging-full-tests.yml, setup actions);
  #          any deleted or renamed .ts/.tsx/.js/.mjs/.cjs file.
  # When the diff cannot be read every flag is true, so a check is never silently dropped.
  # No branch protection requires these checks, so a skipped job never blocks a merge.
  changes:
    name: "Changes"
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      web: ${{ steps.scope.outputs.web }}
      ai: ${{ steps.scope.outputs.ai }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          all() { printf 'web=true\nai=true\nfull=true\n' >> "$GITHUB_OUTPUT"; echo "Run everything: $1"; exit 0; }
          # quotePath=false: non-ASCII paths come out unquoted so the patterns below still match.
          status=$(git -c core.quotePath=false diff --name-status HEAD^1 HEAD) || all "diff failed"
          [ -n "$status" ] || all "empty diff"
          web=false; ai=false; full=false
          [ "$BASE_REF" = main ] && full=true
          # Deleted / renamed code files: specs that vi.mock() the old path are not picked by --changed.
          # Collected first, matched with a herestring: no pipeline, so the result does not depend on
          # pipefail / SIGPIPE if the step's shell options ever change.
          moved=$(grep -E '^(D|R)' <<< "$status" | cut -f2- | tr '\t' '\n' || true)
          if grep -qE '\.(ts|tsx|js|mjs|cjs)$' <<< "$moved"; then
            full=true
          fi
          files=$(cut -f2- <<< "$status" | tr '\t' '\n')
          while IFS= read -r f; do
            case "$f" in
              .github/ISSUE_TEMPLATE/*) ;;
              .github/workflows/ci.yml|.github/workflows/unit-tests.yml|.github/workflows/staging-full-tests.yml|.github/actions/setup-deps/*|.github/actions/setup-vercel-cli/*)
                web=true; ai=true; full=true ;;
              # Other workflows/actions: specs that assert workflow content read them as files.
              .github/*) web=true ;;
              packages/agent-core/*|packages/ai-contracts/*) web=true; ai=true ;;
              services/ai-platform/*) ai=true ;;
              docs/*|plans/*|.claude/*|.opencode/*|.cursor/*|.gemini/*) ;;
              package.json|package-lock.json|tsconfig*.json|vitest.config.*|.nvmrc|node-polyfill.js|src/__tests__/helpers/*|src/__tests__/mocks/*)
                web=true; full=true ;;
              *) if [[ "$f" == */* || "$f" != *.md ]]; then web=true; fi ;;
            esac
          done <<< "$files"
          printf 'web=%s\nai=%s\nfull=%s\n' "$web" "$ai" "$full" >> "$GITHUB_OUTPUT"
          echo "Changed files: $(wc -l <<< "$files") → web=$web ai-platform=$ai full=$full"

  # ──────────────────────────────────────
  # Job 1: Quality Check — Migrations + Env manifests + Lint + Typecheck
  # ──────────────────────────────────────
  quality-check:
    name: "Quality: Lint + Typecheck"
    # pull_request only — merge commits on staging/main are already
    # validated by the PR's own CI run. Lint and typecheck always cover the
    # whole web app (a type error can surface far from the changed file).
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard against stray lockfiles
        # Repo uses npm only. A stray pnpm-lock.yaml / yarn.lock makes
        # `vercel build` auto-detect pnpm/yarn and spawn a binary the
        # runner does not have (ENOENT), breaking deploy. Seen twice:
        # 83f91a75, then PR #555 (commit e4d0448c) reintroduced it and
        # broke staging deploy run 24412315694. Fail fast here before
        # npm install so dev gets the signal in ~1 second.
        run: |
          STRAY=$(ls pnpm-lock.yaml yarn.lock 2>/dev/null || true)
          if [ -n "$STRAY" ]; then
            echo "::error::Stray lockfile detected: $STRAY"
            echo "::error::Repo uses npm only. Delete with: git rm $STRAY && git commit"
            echo "::error::Background: vercel build auto-detects pnpm/yarn from lockfile"
            echo "::error::and spawns a binary not installed on the CI runner (ENOENT)."
            echo "::error::See plans/260413-1126-vercel-deploy-blocked/ for history."
            exit 1
          fi
          echo "✓ no stray lockfiles"

      - name: Setup Node + dependencies
        uses: ./.github/actions/setup-deps

      - name: Check DB migrations
        run: |
          git fetch origin staging --depth=1
          node scripts/check-migrations.js origin/staging

      - name: Check environment variable manifests
        run: node scripts/check-env-vars.js origin/staging

      # A static import of @payload-config from anything the config imports breaks
      # server actions in production builds only (audit C5). Lazy-import it instead.
      - name: Check Payload import cycles
        run: node scripts/check-payload-cycles.mjs

      - name: Lint
        run: npm run lint

      - name: Restore TypeScript build info
        # tsconfig has incremental: true; reusing tsconfig.tsbuildinfo from the
        # previous run of this PR lets tsc skip unchanged files.
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ github.head_ref }}-

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

  # ──────────────────────────────────────
  # Job 2: Test — affected specs on feature PRs, full suite on release PRs and staging pushes
  # ──────────────────────────────────────
  test:
    name: "Test"
    # Parallel with quality-check (the called workflow installs its own dependencies).
    # Feature PRs run the affected specs + the file-reading specs; PRs into main and diffs that
    # touch global config / CI definition / delete code (see `changes`) run the full suite + coverage. The post-merge full run on
    # staging is .github/workflows/staging-full-tests.yml (outside this run, so it never delays
    # the next deploy).
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/unit-tests.yml
    with:
      mode: ${{ needs.changes.outputs.full == 'true' && 'full' || 'affected' }}
      upload-coverage: ${{ needs.changes.outputs.full == 'true' }}

  # ──────────────────────────────────────
  # Job 2b: ai-platform check — standalone install (Node 24)
  # ──────────────────────────────────────
  # services/ai-platform is a copy synced from the monorepo (AI_LAYER_SOURCE) with its
  # own package-lock.json; it links ../../packages/{agent-core,ai-contracts} via file:.
  # Runs only when the PR touches ai-platform or the packages it links.
  ai-platform-check:
    name: "AI Platform: Typecheck + Test + Build"
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/ai-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: services/ai-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # tsup bundle only (no DB): `build:vercel` also runs migrations, which belong to the deploy job.
        run: npm run build

  # ──────────────────────────────────────
  # Build skipped in CI — Vercel handles build + deploy.
  # Typecheck catches 99% of build errors. Vercel is the safety net.
  # Re-enable build job if needed: uncomment and add to notify-fail needs.
  # ──────────────────────────────────────

  # ──────────────────────────────────────
  # Job 3: Quality Metrics (PR full runs only, after test — affected runs measure no coverage)
  # ──────────────────────────────────────
  metrics:
    name: "PR Metrics"
    needs: [changes, test]
    # Dependabot PRs get a read-only token, so the comment step would 403 and turn the run red.
    if: success() && github.event_name == 'pull_request' && needs.changes.outputs.full == 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ vars.CI_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download coverage
        # Missing when the upload hit the artifact quota; the parse step below
        # already handles a missing coverage-summary.json.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage/

      - name: Parse coverage report
        id: coverage
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            LINES=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.branches.pct)")
            FUNCTIONS=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.functions.pct)")
            STATEMENTS=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.statements.pct)")
          else
            LINES="N/A"; BRANCHES="N/A"; FUNCTIONS="N/A"; STATEMENTS="N/A"
          fi
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "statements=$STATEMENTS" >> "$GITHUB_OUTPUT"

      - name: Comment quality metrics on PR
        uses: actions/github-script@v9
        with:
          script: |
            const coverage = {
              lines: '${{ steps.coverage.outputs.lines }}',
              branches: '${{ steps.coverage.outputs.branches }}',
              functions: '${{ steps.coverage.outputs.functions }}',
              statements: '${{ steps.coverage.outputs.statements }}',
            };
            const minimums = { lines: 60, branches: 65, functions: 55, statements: 60 };
            const targets = { lines: 95, branches: 85, functions: 90, statements: 95 };

            function badge(val, min, target) {
              const v = parseFloat(val);
              if (isNaN(v)) return '⚪';
              if (v >= target) return '💎';
              if (v >= min) return '✅';
              return '🔴';
            }

            const marker = '<!-- quality-metrics -->';
            const body = [
              marker,
              '## 📊 Quality Metrics',
              '',
              '### Test Coverage',
              '| Metric | Current | Min | Target | Status |',
              '|--------|---------|-----|--------|--------|',
              `| Lines | ${coverage.lines}% | ${minimums.lines}% | ${targets.lines}% | ${badge(coverage.lines, minimums.lines, targets.lines)} |`,
              `| Branches | ${coverage.branches}% | ${minimums.branches}% | ${targets.branches}% | ${badge(coverage.branches, minimums.branches, targets.branches)} |`,
              `| Functions | ${coverage.functions}% | ${minimums.functions}% | ${targets.functions}% | ${badge(coverage.functions, minimums.functions, targets.functions)} |`,
              `| Statements | ${coverage.statements}% | ${minimums.statements}% | ${targets.statements}% | ${badge(coverage.statements, minimums.statements, targets.statements)} |`,
              '',
              '---',
              `_Updated: ${new Date().toISOString()} | [View CI Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body,
              });
            }

  # ──────────────────────────────────────
  # Job 5: Notify on CI Failure
  # ──────────────────────────────────────
  notify-fail:
    name: "Notify: CI Failed"
    # pull_request only — deploy jobs have their own dedicated deploy_fail notification and the
    # post-merge full test run (staging-full-tests.yml) has its own; this job catches PR failures.
    needs: [changes, quality-check, test, ai-platform-check]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare failure info
        id: fail_info
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --format='%s' -n 1 | head -c 80)" >> "$GITHUB_OUTPUT"

      - name: Notify CI Failed
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'ci_fail'
          branch: ${{ github.ref_name }}
          author: ${{ github.actor }}
          commit-sha: ${{ steps.fail_info.outputs.short_sha }}
          commit-msg: ${{ steps.fail_info.outputs.commit_msg }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────
  # Job 5b: Deploy scope — which project(s) this push changed (staging / main)
  # ──────────────────────────────────────
  # services/ai-platform/** → ai-platform only; packages/agent-core|ai-contracts/** (ai-platform links
  # them via file:), ci.yml and the setup actions it uses → both; docs/, plans/, .claude/, top-level
  # *.md → neither; anything else → web. Do not add more "neither" paths: the diff is against the
  # previous push, not the last deployed commit, so a skipped deploy can drop an earlier push whose
  # pending run was replaced (its code and migrations would never reach the environment). Every case it cannot read (manual run, new branch, missing commit) deploys both,
  # so a deploy is never silently dropped. A manual run (Actions → CI → Run workflow) redeploys both.
  deploy-scope:
    name: "Deploy: Scope"
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ${{ vars.CI_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      web: ${{ steps.scope.outputs.web }}
      ai: ${{ steps.scope.outputs.ai }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick projects
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          both() { printf 'web=true\nai=true\n' >> "$GITHUB_OUTPUT"; echo "Deploy both: $1"; exit 0; }
          [ "$EVENT" = push ] || both "manual run"
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) both "no previous commit" ;; esac
          git fetch --no-tags --depth=1 origin "$BEFORE" || both "previous commit $BEFORE not fetchable"
          files=$(git -c core.quotePath=false diff --name-only "$BEFORE" "$SHA") || both "diff failed"
          [ -n "$files" ] || both "empty diff"
          web=false; ai=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/ci.yml|.github/actions/setup-deps/*|.github/actions/setup-vercel-cli/*) web=true; ai=true ;;
              packages/agent-core/*|packages/ai-contracts/*) web=true; ai=true ;;
              services/ai-platform/*) ai=true ;;
              docs/*|plans/*|.claude/*) ;;
              *) if [[ "$f" == */* || "$f" != *.md ]]; then web=true; fi ;;
            esac
          done <<< "$files"
          printf 'web=%s\nai=%s\n' "$web" "$ai" >> "$GITHUB_OUTPUT"
          echo "Changed files: $(wc -l <<< "$files") → web=$web ai-platform=$ai"

  # ──────────────────────────────────────
  # Job 6: Deploy to Vercel (staging branch)
  # ──────────────────────────────────────
  deploy-staging:
    name: "Deploy: Vercel (staging)"
    # Waits for the ai-platform deploy: prime-web on staging calls AI_PLATFORM_URL, so it must
    # not go live ahead of a failed ai-platform deploy. A skipped one (push did not touch
    # ai-platform) is fine. quality-check/test run on the PR only.
    needs: [deploy-scope, deploy-ai-platform]
    if: "!cancelled() && github.ref == 'refs/heads/staging' && needs.deploy-scope.outputs.web == 'true' && needs.deploy-ai-platform.result != 'failure'"
    runs-on: ${{ vars.CI_DEPLOY_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: vercel-deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      # Each environment has its own Sentry project; uploading both builds' source maps
      # to one project leaves the other's stack traces minified.
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_STAGING || secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node + dependencies
        # node_modules from the lockfile-keyed cache: `vercel build` then finds dependencies in
        # place and its own `npm install` is a no-op check instead of a ~1.5-2 min fresh install
        # (this replaces setup-node's 1.9 GB ~/.npm cache restore).
        uses: ./.github/actions/setup-deps

      - name: Get commit subject
        id: commit
        # First line of the commit message, trimmed to 80 chars.
        # Bot's extractPRNumber() parses `Merge pull request #N` or `(#N)`
        # and fetches full PR details from GitHub API — richer cards.
        run: |
          SUBJECT=$(git log -1 --format='%s' | head -c 80)
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "commit subject: $SUBJECT"

      - name: Cache Next.js build output
        # .next/cache holds Next 16's Turbopack build cache (turbopackFileSystemCacheForBuild is
        # on by default), so unchanged modules are not recompiled. Always restored; saved once a
        # day (first deploy of the day) — the old per-commit key uploaded ~715 MB after every
        # deploy (~3.5 min of runner time) and evicted the dependency caches.
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ steps.commit.outputs.day }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
            next-${{ github.job }}-

      - name: Setup Vercel CLI
        uses: ./.github/actions/setup-vercel-cli

      - name: Pull Vercel env (staging custom environment)
        # --environment=staging pulls the custom env directly, which stamps
        # .vercel/.env.staging.local with VERCEL_TARGET_ENV=staging. This
        # metadata must match `vercel build --target=staging` and
        # `vercel deploy --prebuilt --target=staging` below, otherwise the
        # CLI aborts with a "prebuilt environment mismatch" error.
        run: vercel pull --yes --environment=staging --token="$VERCEL_TOKEN"

      - name: Preflight — AI platform env (staging, warn only)
        # Same check as production (scripts/ci/ai-env-preflight.mjs) but never blocks staging:
        # missing / bad AI_PLATFORM_URL or AI_PLATFORM_CONTEXT_SECRET → ::warning:: only.
        run: node scripts/ci/ai-env-preflight.mjs .vercel/.env.staging.local --warn-only

      - name: Preflight — Postgres reachable
        run: |
          # Ensure the DB is reachable from the runner before build runs migrations.
          # Reads DATABASE_URI from the env file that vercel pull just wrote.
          set -e
          ENV_FILE=".vercel/.env.staging.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::vercel pull did not produce $ENV_FILE"
            exit 1
          fi
          # shellcheck disable=SC1090
          set -a && . "$ENV_FILE" && set +a
          if [ -z "${DATABASE_URI:-}" ]; then
            echo "::error::DATABASE_URI not present in $ENV_FILE"
            exit 1
          fi
          # TCP-level probe using node builtins — no npm install required.
          node -e "
            const net = require('net');
            const u = new URL(process.env.DATABASE_URI);
            const s = net.createConnection({ host: u.hostname, port: Number(u.port || 5432) });
            s.setTimeout(5000);
            s.on('connect', () => { console.log('pg tcp ok ('+u.hostname+':'+(u.port||5432)+')'); s.end(); process.exit(0); });
            s.on('timeout', () => { console.error('pg tcp timeout'); process.exit(1); });
            s.on('error',   (e) => { console.error('pg tcp err:', e.message); process.exit(1); });
          "

      - name: Build --target=staging
        # --target=staging must match both the pulled env metadata
        # (VERCEL_TARGET_ENV=staging from --environment=staging) and the
        # deploy flag below. Without it, vercel build stamps the prebuilt
        # output with target=preview and vercel deploy --prebuilt
        # --target=staging fails the prebuilt environment mismatch check.
        run: vercel build --target=staging --token="$VERCEL_TOKEN"

      - name: Deploy --prebuilt --target=staging
        id: deploy
        run: |
          # --target=staging routes this deploy at the custom "staging"
          # environment so Vercel auto-aliases it to web-v2.dev.ecommercehub.my.
          # Without --target the deploy lands in generic Preview and the
          # staging alias stays on the previous deployment.
          set -e
          URL=$(vercel deploy --prebuilt --target=staging --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Verify alias rollover
        run: |
          # Authoritative API check — does web-v2.dev.ecommercehub.my now
          # point at the deployment we just created? If not, fail the job
          # with a clear error so we don't silently serve stale staging.
          set -e
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          EXPECTED="${DEPLOY_URL#https://}"
          for i in 1 2 3 4 5; do
            # -s (silent) not -sf — HTTP errors still pipe body to node,
            # which returns empty string via try/catch. `set -e` therefore
            # never aborts the loop on a transient API blip.
            ACTUAL=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v4/aliases/web-v2.dev.ecommercehub.my?teamId=$VERCEL_ORG_ID" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).deployment?.url||'')}catch{console.log('')}})")
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "✓ alias rolled over: web-v2.dev.ecommercehub.my -> $ACTUAL"
              exit 0
            fi
            echo "attempt $i: expected=$EXPECTED actual=$ACTUAL — retrying in 5s..."
            sleep 5
          done
          echo "::error::alias web-v2.dev.ecommercehub.my did not roll over to $EXPECTED (still $ACTUAL)"
          exit 1

      - name: Seed templates (post-deploy)
        # Plan 260419-2022 Phase 03 — force replace-all reseed against the
        # freshly aliased deploy. Keeps Payload Templates in sync with
        # shipped block code. ADR: force strategy chosen because admin
        # doesn't edit templates directly today; revisit when editing UI
        # lands. SEED_TOKEN mirrored in Vercel env (staging scope).
        env:
          DEPLOY_URL: https://web-v2.dev.ecommercehub.my
          SEED_TOKEN: ${{ secrets.SEED_TOKEN }}
        run: bash .github/scripts/seed-templates-post-deploy.sh

      - name: Notify deploy success
        if: success()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_success'
          environment: 'staging'
          branch: staging
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ steps.deploy.outputs.url }}

      - name: Notify deploy fail
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_fail'
          environment: 'staging'
          branch: staging
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────
  # Job 7: Deploy to Vercel (main branch → production)
  # ──────────────────────────────────────
  deploy-production:
    name: "Deploy: Vercel (production)"
    # Waits for the ai-platform production deploy — see deploy-staging.
    needs: [deploy-scope, deploy-ai-platform-production]
    if: "!cancelled() && github.ref == 'refs/heads/main' && needs.deploy-scope.outputs.web == 'true' && needs.deploy-ai-platform-production.result != 'failure'"
    runs-on: ${{ vars.CI_DEPLOY_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: vercel-deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_PRODUCTION || secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node + dependencies
        # node_modules from the lockfile-keyed cache: `vercel build` then finds dependencies in
        # place and its own `npm install` is a no-op check instead of a ~1.5-2 min fresh install
        # (this replaces setup-node's 1.9 GB ~/.npm cache restore).
        uses: ./.github/actions/setup-deps

      - name: Get commit subject
        id: commit
        # First line of the commit message, trimmed to 80 chars.
        # Bot's extractPRNumber() parses `Merge pull request #N` or `(#N)`
        # and fetches full PR details from GitHub API — richer cards.
        run: |
          SUBJECT=$(git log -1 --format='%s' | head -c 80)
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "commit subject: $SUBJECT"

      - name: Cache Next.js build output
        # .next/cache holds Next 16's Turbopack build cache (turbopackFileSystemCacheForBuild is
        # on by default), so unchanged modules are not recompiled. Always restored; saved once a
        # day (first deploy of the day) — the old per-commit key uploaded ~715 MB after every
        # deploy (~3.5 min of runner time) and evicted the dependency caches.
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ steps.commit.outputs.day }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
            next-${{ github.job }}-

      - name: Setup Vercel CLI
        uses: ./.github/actions/setup-vercel-cli

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Preflight — AI platform env (production)
        # Without AI_PLATFORM_URL (https) + AI_PLATFORM_CONTEXT_SECRET (32+ chars) production still
        # runs, but onboarding falls back to rule-based sites, auto SEO stops and /api/ai/* answers
        # 503 — silently. Fail the deploy here (Notify deploy fail pings Lark). An empty secret only
        # warns (a Vercel Sensitive variable is pulled empty). AI_AGENT_ENABLED is not checked: the
        # copilot is off on production on purpose. To ship without AI deliberately, set repo
        # variable ALLOW_PROD_WITHOUT_AI=true (problems become warnings).
        env:
          ALLOW_PROD_WITHOUT_AI: ${{ vars.ALLOW_PROD_WITHOUT_AI }}
        run: node scripts/ci/ai-env-preflight.mjs .vercel/.env.production.local

      - name: Preflight — Postgres reachable
        run: |
          set -e
          ENV_FILE=".vercel/.env.production.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::vercel pull did not produce $ENV_FILE"
            exit 1
          fi
          # shellcheck disable=SC1090
          set -a && . "$ENV_FILE" && set +a
          if [ -z "${DATABASE_URI:-}" ]; then
            echo "::error::DATABASE_URI not present in $ENV_FILE"
            exit 1
          fi
          # TCP-level probe using node builtins — no npm install required.
          node -e "
            const net = require('net');
            const u = new URL(process.env.DATABASE_URI);
            const s = net.createConnection({ host: u.hostname, port: Number(u.port || 5432) });
            s.setTimeout(5000);
            s.on('connect', () => { console.log('pg tcp ok ('+u.hostname+':'+(u.port||5432)+')'); s.end(); process.exit(0); });
            s.on('timeout', () => { console.error('pg tcp timeout'); process.exit(1); });
            s.on('error',   (e) => { console.error('pg tcp err:', e.message); process.exit(1); });
          "

      - name: Build (prod)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy --prebuilt --prod
        id: deploy
        run: |
          set -e
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Seed templates (post-deploy)
        # Plan 260419-2022 Phase 03 — mirror of staging seed step against prod
        # alias. SEED_TOKEN must be mirrored in Vercel production env.
        # NOTE: staging freshness gate deferred (see plan.md — nice-to-have).
        # Target the deployment URL, not the production domain: on the first deploy
        # (and during cutover) the domain still points at v1. /api/* skips host routing.
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SEED_TOKEN: ${{ secrets.SEED_TOKEN }}
          # Production never force-reseeds: force deletes + recreates templates and cascades
          # to template_versions / quality_scores / content packs.
          SEED_FORCE: 'false'
        run: bash .github/scripts/seed-templates-post-deploy.sh

      - name: Notify deploy success
        if: success()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_success'
          environment: 'production'
          branch: main
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ steps.deploy.outputs.url }}

      - name: Notify deploy fail
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_fail'
          environment: 'production'
          branch: main
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────
  # Job 6b: Deploy ai-platform to Vercel (staging branch) — separate project
  # ──────────────────────────────────────
  deploy-ai-platform:
    name: "Deploy: AI Platform (staging)"
    # Only deploy-scope: CI already ran on the PR.
    needs: deploy-scope
    if: github.ref == 'refs/heads/staging' && needs.deploy-scope.outputs.ai == 'true'
    runs-on: ${{ vars.CI_DEPLOY_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: vercel-deploy-ai-platform-staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # Separate Vercel project (Root Directory left EMPTY — the CLI runs from services/ai-platform
      # and builds on the runner, where the file: deps in ../../packages exist).
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AI_PLATFORM_PROJECT_ID }}
    defaults:
      run:
        working-directory: services/ai-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: services/ai-platform/package-lock.json

      - name: Get commit subject
        id: commit
        run: |
          SUBJECT=$(git log -1 --format='%s' | head -c 70)
          echo "subject=[ai-platform] $SUBJECT" >> "$GITHUB_OUTPUT"
          echo "commit subject: $SUBJECT"

      - name: Setup Vercel CLI
        uses: ./.github/actions/setup-vercel-cli

      - name: Pull Vercel env (staging)
        # Same rules as deploy-staging: --environment=staging stamps
        # .vercel/.env.staging.local with VERCEL_TARGET_ENV=staging, which must match
        # `vercel build --target=staging` and `vercel deploy --prebuilt --target=staging`.
        run: vercel pull --yes --environment=staging --token="$VERCEL_TOKEN"

      - name: Preflight — ai-platform Postgres reachable
        # `npm run build:vercel` applies migrations when AI_PLATFORM_DATABASE_URL is set.
        # Fail here (not mid-build) when it is missing or unreachable from the runner.
        # Reads only that key (never sourced, never printed). Path is from services/ai-platform.
        run: node ../../scripts/ci/pg-tcp-check.mjs .vercel/.env.staging.local AI_PLATFORM_DATABASE_URL

      - name: Build --target=staging
        run: vercel build --target=staging --token="$VERCEL_TOKEN"

      - name: Deploy --prebuilt --target=staging
        id: deploy
        run: |
          set -e
          URL=$(vercel deploy --prebuilt --target=staging --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Notify deploy success
        if: success()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_success'
          environment: 'staging'
          branch: staging
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ steps.deploy.outputs.url }}

      - name: Notify deploy fail
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_fail'
          environment: 'staging'
          branch: staging
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────
  # Job 7b: Deploy ai-platform to Vercel (main branch → production) — separate project
  # ──────────────────────────────────────
  deploy-ai-platform-production:
    name: "Deploy: AI Platform (production)"
    # Only deploy-scope: CI already ran on the PR.
    needs: deploy-scope
    if: github.ref == 'refs/heads/main' && needs.deploy-scope.outputs.ai == 'true'
    runs-on: ${{ vars.CI_DEPLOY_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: vercel-deploy-ai-platform-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # Separate Vercel project (Root Directory left EMPTY — the CLI runs from services/ai-platform
      # and builds on the runner, where the file: deps in ../../packages exist).
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AI_PLATFORM_PROJECT_ID }}
    defaults:
      run:
        working-directory: services/ai-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: services/ai-platform/package-lock.json

      - name: Get commit subject
        id: commit
        run: |
          SUBJECT=$(git log -1 --format='%s' | head -c 70)
          echo "subject=[ai-platform] $SUBJECT" >> "$GITHUB_OUTPUT"
          echo "commit subject: $SUBJECT"

      - name: Setup Vercel CLI
        uses: ./.github/actions/setup-vercel-cli

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Preflight — ai-platform Postgres reachable
        # `npm run build:vercel` applies migrations when AI_PLATFORM_DATABASE_URL is set.
        # Fail here (not mid-build) when it is missing or unreachable from the runner.
        # Reads only that key (never sourced, never printed). Path is from services/ai-platform.
        run: node ../../scripts/ci/pg-tcp-check.mjs .vercel/.env.production.local AI_PLATFORM_DATABASE_URL

      - name: Build --prod
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy --prebuilt --prod
        id: deploy
        run: |
          set -e
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Notify deploy success
        if: success()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_success'
          environment: 'production'
          branch: main
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ steps.deploy.outputs.url }}

      - name: Notify deploy fail
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_fail'
          environment: 'production'
          branch: main
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────
  # Job 7c: Deploy ai-platform to Vercel (qc-test branch → Preview scope)
  # ──────────────────────────────────────
  # qc-test needs its own ai-platform deploy: the platform calls back into one
  # prime-web (PRIME_WEB_INTERNAL_URL), so sharing the staging deploy would let
  # QC chat edit staging shops. Env vars live in the ech-ai-platform project
  # under scope "Preview + branch qc-test" (own Neon DB, own daily budget).
  deploy-ai-platform-qc-test:
    name: "Deploy: AI Platform (qc-test)"
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/qc-test'
    runs-on: ${{ vars.CI_DEPLOY_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: vercel-deploy-ai-platform-qc-test
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AI_PLATFORM_PROJECT_ID }}
    defaults:
      run:
        working-directory: services/ai-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: services/ai-platform/package-lock.json

      - name: Get commit subject
        id: commit
        run: |
          SUBJECT=$(git log -1 --format='%s' | head -c 70)
          echo "subject=[ai-platform] $SUBJECT" >> "$GITHUB_OUTPUT"
          echo "commit subject: $SUBJECT"

      - name: Setup Vercel CLI
        uses: ./.github/actions/setup-vercel-cli

      - name: Pull Vercel env (Preview scope + branch=qc-test overrides)
        run: |
          vercel pull --yes \
            --environment=preview \
            --git-branch=qc-test \
            --token="$VERCEL_TOKEN"

      - name: Preflight — ai-platform Postgres reachable
        run: |
          set -e
          ENV_FILE=".vercel/.env.preview.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::vercel pull did not produce $ENV_FILE"
            exit 1
          fi
          # shellcheck disable=SC1090
          set -a && . "$ENV_FILE" && set +a
          if [ -z "${AI_PLATFORM_DATABASE_URL:-}" ]; then
            echo "::error::AI_PLATFORM_DATABASE_URL not present in $ENV_FILE"
            echo "::error::Fix: ech-ai-platform → env vars → scope Preview + branch=qc-test"
            exit 1
          fi
          node -e "
            const net = require('net');
            const u = new URL(process.env.AI_PLATFORM_DATABASE_URL);
            const s = net.createConnection({ host: u.hostname, port: Number(u.port || 5432) });
            s.setTimeout(5000);
            s.on('connect', () => { console.log('pg tcp ok ('+u.hostname+':'+(u.port||5432)+')'); s.end(); process.exit(0); });
            s.on('timeout', () => { console.error('pg tcp timeout'); process.exit(1); });
            s.on('error',   (e) => { console.error('pg tcp err:', e.message); process.exit(1); });
          "

      - name: Build (preview)
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy --prebuilt (preview)
        id: deploy
        run: |
          set -e
          URL=$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Promote alias → ech-ai-platform-qc.vercel.app
        # Stable URL for prime-web qc-test's AI_PLATFORM_URL (preview deploys
        # get a new URL each time) — same reason as deploy-qc-test's alias step.
        run: |
          set -e
          URL="${{ steps.deploy.outputs.url }}"
          URL="${URL#https://}"
          vercel alias set "$URL" ech-ai-platform-qc.vercel.app --token="$VERCEL_TOKEN"
          echo "Alias rolled: ech-ai-platform-qc.vercel.app → $URL"

      - name: Notify deploy fail
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_fail'
          environment: 'qc-test'
          branch: qc-test
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────
  # Job 8: Deploy to Vercel (qc-test branch → Preview scope with branch-filter)
  # ──────────────────────────────────────
  # Isolated QC environment for JMeter / load / E2E tests.
  #
  # Architecture:
  #   - Neon project ech-prime-web-v2-qc-test (Free tier) — data + compute
  #     + quota isolated from staging
  #   - Vercel Preview scope with branch-filter (branch=qc-test) — env vars
  #     (DATABASE_URI, APP_ENV, QC_SEED_PASSWORD) override staging values
  #     only for this specific branch. Pro plan does not permit a second
  #     custom environment (staging already occupies the slot), so we
  #     leverage Vercel's built-in branch-filter feature instead.
  #   - Branch `qc-test` protected — QC lead + dev owner push only
  #
  # Deploy target is `preview` (default) — Vercel picks branch-scoped env
  # vars automatically based on `github.ref`. No `--target=qc-test` flag
  # because there is no custom env named `qc-test` on Vercel.
  # Plan: plans/260702-1719-qc-test-env-setup/
  deploy-qc-test:
    name: "Deploy: Vercel (qc-test)"
    # Accepts both push (normal branch push) and workflow_dispatch (invoked
    # by sync-staging-to-qc-test.yml after auto-merging staging into qc-test).
    # Waits for the qc-test ai-platform deploy — see deploy-staging.
    needs: deploy-ai-platform-qc-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/qc-test'
    runs-on: ${{ vars.CI_DEPLOY_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: vercel-deploy-qc-test
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node + dependencies
        # node_modules from the lockfile-keyed cache: `vercel build` then finds dependencies in
        # place and its own `npm install` is a no-op check instead of a ~1.5-2 min fresh install
        # (this replaces setup-node's 1.9 GB ~/.npm cache restore).
        uses: ./.github/actions/setup-deps

      - name: Get commit subject
        id: commit
        run: |
          SUBJECT=$(git log -1 --format='%s' | head -c 80)
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "commit subject: $SUBJECT"

      - name: Cache Next.js build output
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-${{ steps.commit.outputs.day }}
          restore-keys: |
            next-${{ github.job }}-${{ hashFiles('package-lock.json') }}-
            next-${{ github.job }}-

      - name: Setup Vercel CLI
        uses: ./.github/actions/setup-vercel-cli

      - name: Pull Vercel env (Preview scope + branch=qc-test overrides)
        # `--environment=preview --git-branch=qc-test` pulls the branch-
        # scoped Preview vars: base Preview vars first, then any var whose
        # scope filter says "Preview + branch: qc-test" wins. Stamps
        # .vercel/.env.preview.local with VERCEL_TARGET_ENV=preview.
        run: |
          vercel pull --yes \
            --environment=preview \
            --git-branch=qc-test \
            --token="$VERCEL_TOKEN"

      - name: Preflight — Postgres reachable
        run: |
          set -e
          ENV_FILE=".vercel/.env.preview.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::vercel pull did not produce $ENV_FILE"
            exit 1
          fi
          # shellcheck disable=SC1090
          set -a && . "$ENV_FILE" && set +a
          if [ -z "${DATABASE_URI:-}" ]; then
            echo "::error::DATABASE_URI not present in $ENV_FILE"
            exit 1
          fi
          # Sanity check: must resolve to QC endpoint, not staging.
          if echo "$DATABASE_URI" | grep -q "ep-blue-king-a1qufqjg"; then
            echo "::error::DATABASE_URI points at staging endpoint — branch-filter override missing"
            echo "::error::Fix: Vercel Dashboard → env vars → add DATABASE_URI with scope Preview + branch=qc-test"
            exit 1
          fi
          node -e "
            const net = require('net');
            const u = new URL(process.env.DATABASE_URI);
            const s = net.createConnection({ host: u.hostname, port: Number(u.port || 5432) });
            s.setTimeout(5000);
            s.on('connect', () => { console.log('pg tcp ok ('+u.hostname+':'+(u.port||5432)+')'); s.end(); process.exit(0); });
            s.on('timeout', () => { console.error('pg tcp timeout'); process.exit(1); });
            s.on('error',   (e) => { console.error('pg tcp err:', e.message); process.exit(1); });
          "

      - name: Build (preview)
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy --prebuilt (preview)
        id: deploy
        run: |
          set -e
          URL=$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Promote alias → ech-prime-web-v2-qc.vercel.app
        # vercel deploy creates a per-deploy URL. The stable QC domain needs an
        # explicit alias to each new deploy — Vercel's automatic branch-alias
        # rollover does NOT apply to preview scope. Without this, QA keeps
        # hitting whichever deploy first claimed the alias (as happened on
        # 2026-07-09: OTP bypass deploy built successfully but alias stayed
        # pinned to a 6-day-old deploy).
        run: |
          set -e
          URL="${{ steps.deploy.outputs.url }}"
          URL="${URL#https://}"
          vercel alias set "$URL" ech-prime-web-v2-qc.vercel.app --token="$VERCEL_TOKEN"
          echo "Alias rolled: ech-prime-web-v2-qc.vercel.app → $URL"

      - name: Notify deploy success
        if: success()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_success'
          environment: 'qc-test'
          branch: qc-test
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ steps.deploy.outputs.url }}

      - name: Notify deploy fail
        if: failure()
        uses: ./.github/actions/smart-notify
        with:
          bot-url: ${{ secrets.BOT_NOTIFY_URL }}
          bot-secret: ${{ secrets.BOT_SECRET }}
          event: 'deploy_fail'
          environment: 'qc-test'
          branch: qc-test
          author: ${{ github.actor }}
          commit-sha: ${{ github.sha }}
          commit-msg: ${{ steps.commit.outputs.subject }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
