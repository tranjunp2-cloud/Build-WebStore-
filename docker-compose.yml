# ── PrimeWeb — Docker Compose (Development) ──────────────────────────────
# Chạy: docker compose up -d
# Tất cả services cần thiết cho dev: App + PostgreSQL + MinIO (S3)
# ─────────────────────────────────────────────────────────────────────────

services:
  # ── Next.js + Payload CMS App ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: primeweb-app
    ports:
      - "3005:3000"
    environment:
      - DATABASE_URI=postgresql://primeweb:primeweb_secret@postgres:5432/primeweb
      - PAYLOAD_SECRET=primeweb-dev-secret-2026
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3005
      - NEXT_PUBLIC_PLATFORM_DOMAIN=localhost:3005
      - NEXT_PUBLIC_APP_URL=http://localhost:3005
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=primeweb-media
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_REGION=us-east-1
    volumes:
      - ./src:/app/src # Hot reload for source code
      - ./public:/app/public # Static assets
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - primeweb-net

  # ── PostgreSQL Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: primeweb-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: primeweb
      POSTGRES_USER: primeweb
      POSTGRES_PASSWORD: primeweb_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U primeweb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - primeweb-net

  # ── MinIO (S3-compatible Object Storage) ───────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: primeweb-storage
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - primeweb-net

  # ── MinIO Bucket Setup (runs once) ────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: primeweb-storage-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        mc alias set myminio http://minio:9000 minioadmin minioadmin;
        mc mb myminio/primeweb-media --ignore-existing;
        mc anonymous set public myminio/primeweb-media;
        echo 'Bucket created successfully';
      "
    networks:
      - primeweb-net

volumes:
  postgres_data:
  minio_data:
  node_modules:


networks:
  primeweb-net:
    driver: bridge
