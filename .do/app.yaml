# DigitalOcean App Platform — App Spec
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
# This file is used by digitalocean/app_action/deploy@v2 in CI for PR preview deploys.

name: ech-prime-web-v2-staging

region: sgp1

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 3000

    instance_count: 1
    instance_size_slug: professional-xs

    github:
      repo: primeproduction/ech-prime-web-v2
      branch: staging
      deploy_on_push: false

    health_check:
      http_path: /

    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URI
        value: ${db.DATABASE_URL}
      - key: PAYLOAD_SECRET
        type: SECRET
      - key: NEXT_PUBLIC_SERVER_URL
        value: ${APP_URL}
      - key: NEXT_PUBLIC_PLATFORM_DOMAIN
        value: ${APP_DOMAIN}
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
      - key: S3_ENDPOINT
        type: SECRET
      - key: S3_BUCKET
        value: primeweb-media
      - key: S3_ACCESS_KEY_ID
        type: SECRET
      - key: S3_SECRET_ACCESS_KEY
        type: SECRET
      - key: S3_REGION
        value: sgp1

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
