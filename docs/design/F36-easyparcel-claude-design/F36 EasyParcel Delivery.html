<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F36 — EasyParcel Delivery</title>

  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="f36/f36.css">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; background: #f0eee9; }
    .dc-card { background: #0b1120; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="f36/atoms.jsx"></script>
  <script type="text/babel" src="f36/screen-a-settings.jsx"></script>
  <script type="text/babel" src="f36/screen-b-checkout.jsx"></script>
  <script type="text/babel" src="f36/screen-c-label.jsx"></script>
  <script type="text/babel" src="f36/screen-d-tracking.jsx"></script>
  <script type="text/babel" src="f36/screen-e-returns.jsx"></script>

  <script type="text/babel">
    const { useEffect } = React;
    const { SettingsScreen, CheckoutScreen, LabelScreen, TrackingScreen, ReturnsScreen } = window;

    function App() {
      // keep lucide icons hydrated as artboards mount/scroll into view
      useEffect(() => {
        const id = setInterval(() => window.lucide && window.lucide.createIcons(), 350);
        return () => clearInterval(id);
      }, []);

      return (
        <DesignCanvas>

          {/* ── A · Settings ─────────────────────────────────────────── */}
          <DCSection id="a-settings"
            title="A · EasyParcel Settings — dashboard (dark)"
            subtitle="Settings › Shipping › tab EasyParcel (beside Flat Rate). Non-custody: cước trừ thẳng ví merchant, không markup. Connect mirrors F34 Payments (2 masked keys + Test). NO env selector (auto-detect). Disconnected shows only the Connect block; a passing Test reveals ONE courier (single-select, default J&T, no price). No default-parcel / fulfilment-mode / wallet UI.">
            <DCArtboard id="a-disconnected" label="Disconnected — chỉ block Connect" width={1440} height={1000}>
              <SettingsScreen state="disconnected" />
            </DCArtboard>
            <DCArtboard id="a-testing" label="Testing — form disabled, spinner" width={1440} height={1000}>
              <SettingsScreen state="testing" />
            </DCArtboard>
            <DCArtboard id="a-invalid" label="Invalid — KEY / WAREHOUSE, không lưu" width={1440} height={1080}>
              <SettingsScreen state="invalid" />
            </DCArtboard>
            <DCArtboard id="a-connected" label="Connected — 1 courier/shop (no price)" width={1440} height={1180}>
              <SettingsScreen state="connected" />
            </DCArtboard>
            <DCArtboard id="a-saving" label="Saving — spinner → toast" width={1440} height={1180}>
              <SettingsScreen state="saving" />
            </DCArtboard>
            <DCArtboard id="a-mobile" label="Mobile 375 — connected" width={375} height={1180}>
              <SettingsScreen state="connected" mobile={true} />
            </DCArtboard>
          </DCSection>

          {/* ── B · Checkout ─────────────────────────────────────────── */}
          <DCSection id="b-checkout"
            title="B · Checkout multi-courier rate — storefront (light)"
            subtitle="/sites/[slug]/checkout. Buyer picks a courier (radio cards: logo · ETA · giá) and the Total re-totals realtime. Fallback (EasyParcel off/lỗi) silently shows one flat rate — buyer never sees the difference.">
            <DCArtboard id="b-empty" label="Empty — chưa đủ địa chỉ" width={1440} height={760}>
              <CheckoutScreen state="empty" />
            </DCArtboard>
            <DCArtboard id="b-loading" label="Loading — skeleton, debounce 300ms" width={1440} height={820}>
              <CheckoutScreen state="loading" />
            </DCArtboard>
            <DCArtboard id="b-rates" label="Rates — RadioGroup (J&T selected)" width={1440} height={880}>
              <CheckoutScreen state="rates" />
            </DCArtboard>
            <DCArtboard id="b-free" label="Free shipping — 🎉 FREE badge" width={1440} height={900}>
              <CheckoutScreen state="free" />
            </DCArtboard>
            <DCArtboard id="b-fallback" label="Fallback — flat rate (im lặng)" width={1440} height={720}>
              <CheckoutScreen state="fallback" />
            </DCArtboard>
            <DCArtboard id="b-mobile" label="Mobile 375 — rates" width={375} height={1320}>
              <CheckoutScreen state="rates" mobile={true} />
            </DCArtboard>
          </DCSection>

          {/* ── C · Create Label ─────────────────────────────────────── */}
          <DCSection id="c-label"
            title="C · Create Label / ShipOrderModal — dashboard (dark · Dialog)"
            subtitle="Orders › [order] › Tạo vận đơn. Two-step create (giữ chỗ → trừ ví). Once an AWB exists the form locks — idempotent, chống double-charge. WALLET_LOW leaves the order unchanged.">
            <DCArtboard id="c-form" label="Form — prefill từ buyer" width={1440} height={960}>
              <LabelScreen state="form" />
            </DCArtboard>
            <DCArtboard id="c-submitting" label="Step 1 — Đang giữ chỗ…" width={1440} height={960}>
              <LabelScreen state="submitting" />
            </DCArtboard>
            <DCArtboard id="c-paying" label="Step 2 — Đang trừ ví…" width={1440} height={960}>
              <LabelScreen state="paying" />
            </DCArtboard>
            <DCArtboard id="c-success" label="Success — AWB + In nhãn" width={1440} height={960}>
              <LabelScreen state="success" />
            </DCArtboard>
            <DCArtboard id="c-error" label="Error — EASYPARCEL_WALLET_LOW" width={1440} height={960}>
              <LabelScreen state="error" />
            </DCArtboard>
          </DCSection>

          {/* ── D · Tracking ─────────────────────────────────────────── */}
          <DCSection id="d-tracking"
            title="D · Buyer Order Tracking — storefront (light)"
            subtitle="/sites/[slug]/orders/[orderNumber]. Vertical timeline: done = green, now = blue glow, pending = gray. Polling every 30–60 min (not realtime). Preparing hides the timeline; Delivered fills every node.">
            <DCArtboard id="d-preparing" label="Preparing — timeline ẩn" width={1000} height={620}>
              <TrackingScreen state="preparing" />
            </DCArtboard>
            <DCArtboard id="d-transit" label="In transit — mốc 'now' glow" width={1000} height={900}>
              <TrackingScreen state="in-transit" />
            </DCArtboard>
            <DCArtboard id="d-delivered" label="Delivered — tất cả filled" width={1000} height={920}>
              <TrackingScreen state="delivered" />
            </DCArtboard>
            <DCArtboard id="d-mobile" label="Mobile 375 — in transit" width={375} height={1080}>
              <TrackingScreen state="in-transit" mobile={true} />
            </DCArtboard>
          </DCSection>

          {/* ── E · Returns ──────────────────────────────────────────── */}
          <DCSection id="e-returns"
            title="E · Returns / Refund — dashboard (dark · Dialog)"
            subtitle="Orders › [order] › Xử lý trả hàng. Reverse-label vs buyer-self-return, cước trừ ví. The auxiliary 3-tier block shows how a cancel refunds depending on shipment progress (chưa mua label → đã pickup).">
            <DCArtboard id="e-form" label="Form — reverse + 3-tier refund" width={1440} height={1060}>
              <ReturnsScreen state="form" />
            </DCArtboard>
            <DCArtboard id="e-submitting" label="Submitting — Đang tạo nhãn trả…" width={1440} height={1060}>
              <ReturnsScreen state="submitting" />
            </DCArtboard>
            <DCArtboard id="e-success" label="Success — return AWB" width={1440} height={1060}>
              <ReturnsScreen state="success" />
            </DCArtboard>
            <DCArtboard id="e-error" label="Error — API err + Thử lại" width={1440} height={1060}>
              <ReturnsScreen state="error" />
            </DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
