<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout — FurnitureHub</title>
    <meta
      name="prototype-source"
      content="https://fn102.web.ecommercehub.unifi.com.my"
    />
    <link rel="stylesheet" href="../_v2.css" />
  </head>
  <body>
    <main
      class="checkout-shell"
      data-runtime-component="CheckoutClient"
      data-mapping-status="runtime"
    >
      <div class="checkout-brand">
        <a class="brand" href="../index.html"><img src="../_assets/parlo-logo.png" alt="Parlo Logo" style="height: 32px; max-width: 150px; object-fit: contain;"></a>
      </div>
      <h1>Checkout</h1>
      <div class="checkout-grid">
        <section
          class="checkout-card"
          data-runtime-component="CheckoutClient.ContactAndDelivery"
          data-mapping-status="runtime"
        >
          <h2>Contact & delivery</h2>
          <div class="field-grid">
            <input placeholder="First name" aria-label="First name" /><input
              placeholder="Last name"
              aria-label="Last name"
            />
          </div>
          <input
            style="margin-top: 14px"
            placeholder="Email"
            aria-label="Email"
          /><input
            style="margin-top: 14px"
            placeholder="Address"
            aria-label="Address"
          />
          <h2>Shipping</h2>
          <label class="runtime-note" style="display: block">
            <input type="radio" checked disabled style="width: auto" />
            Standard delivery · Calculated in production
          </label>
          <h2>Payment</h2>
          <label class="runtime-note" style="display: block">
            <input type="radio" checked disabled style="width: auto" />
            Secure online payment · Static preview
          </label>
          <button class="btn" disabled>Place order — static preview</button>
        </section>
        <aside
          class="checkout-card"
          data-runtime-component="CheckoutClient.OrderSummary"
          data-mapping-status="runtime"
        >
          <h2>Order summary</h2>
          <div class="cart-item">
            <img
              src="../_assets/d231fe65de05-_x1ajigDmW-4QdCm_b0tASMLLPxvI5BQo5ZlzxLtAlM.jpg"
              alt="Minimalist Large Wall Clock"
            />
            <div>
              <strong>Minimalist Large Wall Clock</strong>
              <p>Qty 1</p>
              <div class="price">RM 100</div>
            </div>
          </div>
          <div class="summary">
            <div class="summary-row">
              <span>Subtotal</span><strong>RM 100</strong>
            </div>
            <div class="summary-row">
              <span>Total</span><strong>RM 100</strong>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <script src="../_v2.js"></script>
  </body>
</html>
