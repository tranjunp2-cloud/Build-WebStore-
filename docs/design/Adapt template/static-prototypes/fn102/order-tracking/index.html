<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Track order — FurnitureHub</title>
    <meta
      name="prototype-source"
      content="https://fn102.web.ecommercehub.unifi.com.my"
    />
    <link rel="stylesheet" href="../_v2.css" />
  </head>
  <body>
    <main
      class="lookup-shell"
      data-runtime-component="OrderLookupClient"
      data-mapping-status="runtime"
    >
      <section
        class="lookup"
        data-runtime-component="OrderLookupClient.Form"
        data-mapping-status="runtime"
      >
        <div class="lookup-icon">📦</div>
        <h1>Track your order</h1>
        <p class="muted">Enter your order number to see the latest status.</p>
        <label for="order">Order number</label
        ><input id="order" placeholder="e.g. PW-1024" /><button
          class="btn"
          style="width: 100%; margin-top: 16px"
          disabled
        >
          Find order — preview
        </button>
        <p>
          <a
            href="https://fn102.web.ecommercehub.unifi.com.my/orders"
            data-runtime-link="canonical"
            >Open canonical order lookup</a
          >
        </p>
        <p class="runtime-note">
          Compatibility mirror for /orders. No order data is queried.
        </p>
        <a href="../index.html">← Back to store</a>
      </section>
    </main>
    <script src="../_v2.js"></script>
  </body>
</html>
