<div class="fn104-shade"></div>
<aside class="fn104-cart-drawer" aria-label="Shopping cart">
  <div class="fn104-drawer-head"><h2>YOUR CART</h2><button class="fn104-close" aria-label="Close cart">×</button></div>
  <div class="fn104-drawer-body"></div>
</aside>
<script>
(function(){
  const detail="../articles/logitech-pop-mouse/index.html", cartUrl="../cart/index.html", productsUrl="../products/index.html", assets="../_assets/";
  const shade=document.querySelector('.fn104-shade'),drawer=document.querySelector('.fn104-cart-drawer'),body=document.querySelector('.fn104-drawer-body');
  function currentCart(){try{return JSON.parse(localStorage.getItem('fn104-cart')||'null')}catch(e){return null}}
  function render(){const c=currentCart();body.innerHTML=c?'<img src="'+assets+'ec950ab1b207-E-VExR-Vex2OUqj_hRA_3GyM0phodSP1dXfoneAbUok.jpg"><h3>'+c.name+'</h3><p>QTY: '+c.qty+'</p><strong>RM '+(c.price*c.qty).toFixed(2)+'</strong><br><a class="fn104-drawer-btn" href="'+cartUrl+'">VIEW CART</a>':'<img src="'+assets+'8cbe2e31b4d2-empty-cart.svg"><h3>There are no items in this cart</h3><a class="fn104-drawer-btn" href="'+productsUrl+'">CONTINUE SHOPPING</a>'}
  function openCart(e){if(e)e.preventDefault();render();shade.classList.add('open');drawer.classList.add('open')}
  function closeCart(){shade.classList.remove('open');drawer.classList.remove('open')}
  document.querySelectorAll('.user-basket > a,.icon-basket-loaded').forEach(el=>el.addEventListener('click',openCart));
  document.querySelector('.fn104-close').addEventListener('click',closeCart);shade.addEventListener('click',closeCart);
  const badgeQty=currentCart()?.qty||0;document.querySelectorAll('.user-basket > a').forEach(a=>{let b=a.querySelector('.fn104-badge');if(!b){b=document.createElement('b');b.className='fn104-badge';b.style.cssText='position:absolute;right:-8px;top:-8px;background:#d99c2b;color:#fff;border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:10px';a.appendChild(b)}b.textContent=badgeQty});
  document.querySelectorAll('.blog-list article').forEach(card=>{card.setAttribute('tabindex','0');card.addEventListener('click',e=>{if(e.target.closest('a')?.getAttribute('href'))return;location.href=detail});card.addEventListener('keydown',e=>{if(e.key==='Enter')location.href=detail});card.querySelectorAll('a.btn,a:not([href]),a[href=""]').forEach(a=>a.setAttribute('href',detail));const image=card.querySelector('img');if(image)image.addEventListener('click',()=>location.href=detail)});
})();
</script>
