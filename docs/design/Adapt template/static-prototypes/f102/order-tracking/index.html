<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="../" />
    <title>Track an Order — NIXX</title>
    <link rel="stylesheet" href="_v2.css" />
  </head>
  <body>
    <a class="skip" href="#main-content">Skip to content</a>
    <main
      id="main-content"
      class="lookup-wrap"
      data-runtime-component="OrdersRoute"
      data-mapping-status="runtime"
    >
      <form class="panel lookup-card" onsubmit="return false;">
        <div class="package-icon" aria-hidden="true">□</div>
        <span class="runtime-badge">Orders compatibility route</span>
        <h1>Find your order</h1>
        <p class="muted">
          Enter the order number from your confirmation email.
        </p>
        <label
          style="display: grid; gap: 7px; text-align: left; margin: 24px 0"
        >
          Order number
          <input placeholder="e.g. NIXX-1024" />
        </label>
        <a class="btn" href="/orders" style="width: 100%">Continue to orders</a>
        <p><a href="index.html">← Back to store</a></p>
        <p class="notice">
          Static preview. Live lookup belongs to <strong>/orders</strong>.
        </p>
      </form>
    </main>
  </body>
</html>
