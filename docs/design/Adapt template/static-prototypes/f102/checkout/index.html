<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="../" />
    <title>Checkout — NIXX</title>
    <link rel="stylesheet" href="_v2.css" />
  </head>
  <body>
    <a class="skip" href="#main-content">Skip to content</a>
    <main id="main-content">
      <section
        class="section"
        data-runtime-component="CheckoutRoute"
        data-mapping-status="runtime"
      >
        <div class="container checkout-grid">
          <form class="panel" onsubmit="return false;">
            <span class="runtime-badge">Non-submitting preview</span>
            <h1>Checkout</h1>
            <p class="muted">No order or payment will be created.</p>
            <div class="steps">
              <span class="step active">1 Contact</span
              ><span class="step">2 Delivery</span
              ><span class="step">3 Payment</span>
            </div>
            <h2>Contact & delivery</h2>
            <div class="form-grid">
              <label class="full"
                >Email<input type="email" autocomplete="email" /></label
              ><label>First name<input autocomplete="given-name" /></label
              ><label>Last name<input autocomplete="family-name" /></label
              ><label class="full"
                >Address<input autocomplete="street-address" /></label
              ><label>City<input autocomplete="address-level2" /></label
              ><label>Postal code<input autocomplete="postal-code" /></label>
              <div class="full">
                <button class="btn" type="submit" disabled>
                  Continue — preview
                </button>
              </div>
            </div>
            <h2>Shipping method</h2>
            <label class="panel" style="display: flex; gap: 12px; padding: 16px"
              ><input type="radio" checked disabled /> Standard delivery · 3–5
              days</label
            >
            <h2>Payment</h2>
            <label class="panel" style="display: flex; gap: 12px; padding: 16px"
              ><input type="radio" checked disabled /> Credit or debit
              card</label
            >
          </form>
          <aside class="panel">
            <h2>Order summary</h2>
            <div class="cart-line">
              <img
                src="_assets/1c766da801db-epF8MyFvrq0BTcnAECAQ9iiHZ_u3rN5DfV3sbcwxM48.jpeg"
                width="172"
                height="208"
                alt="High collar ribbed T-shirt"
              />
              <div>
                <strong>High Collar T-shirt</strong>
                <p class="muted">Cream · M</p>
                <span>$50.00</span>
              </div>
            </div>
            <div class="summary-row">
              <span>Total</span><strong class="price">$50.00</strong>
            </div>
            <label style="display: grid; gap: 7px; margin: 18px 0"
              >Discount code<span style="display: flex; gap: 8px"
                ><input style="min-width: 0" disabled /><button
                  class="btn secondary"
                  type="button"
                  disabled
                >
                  Apply
                </button></span
              ></label
            >
            <p class="notice">
              Preview only. Payment and fulfillment are intentionally disabled.
            </p>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
