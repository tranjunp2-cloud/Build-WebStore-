<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cart drawer — GlowBeauty</title>
    <link rel="stylesheet" href="../_assets/c102-v2.css?v=renderer-exact-3" />
  </head>
  <body class="cart-demo-page">
    <main data-runtime-component="CartDrawer" data-mapping-status="runtime">
      <div data-cart-background>
        <a class="cart-demo-back" href="../index.html">← Back to store</a
        ><button
          class="cart-demo-trigger"
          type="button"
          data-cart-open
          aria-label="Open cart preview"
        >
          Open cart preview
        </button>
      </div>
      <div class="cart-backdrop" data-cart-backdrop></div>
      <aside
        class="cart-drawer"
        data-cart-drawer
        role="dialog"
        aria-modal="true"
        aria-labelledby="cart-title"
      >
        <div class="cart-drawer-head">
          <div class="cart-title-row">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 4h2l2.4 11h11.2l2-8H6" />
            </svg>
            <div>
              <h1 id="cart-title">Your cart (1)</h1>
              <p>Review your items</p>
            </div>
          </div>
          <button type="button" data-cart-close aria-label="Close cart">
            ×
          </button>
        </div>
        <div class="cart-drawer-items">
          <article class="drawer-item">
            <div class="drawer-thumb">
              <img
                src="../_assets/96845a6154a5-9_ZQI4YtvY5P9pET8fN1vwCHGrVkPHKNy0aaIicEMuk.webp"
                alt="The Saem Cover Perfection Fixealer"
              />
            </div>
            <div class="drawer-item-info">
              <div class="drawer-item-top">
                <div>
                  <h2>The Saem Cover Perfection Fixealer</h2>
                  <p>01 Clear Beige</p>
                </div>
                <button
                  type="button"
                  aria-label="Remove The Saem Cover Perfection Fixealer"
                >
                  ×
                </button>
              </div>
              <div class="drawer-item-bottom">
                <div class="qty-stepper">
                  <button type="button" aria-label="Decrease quantity" disabled>
                    −</button
                  ><span>1</span
                  ><button type="button" aria-label="Increase quantity">
                    +
                  </button>
                </div>
                <strong>RM 24.00</strong>
              </div>
            </div>
          </article>
        </div>
        <div class="cart-drawer-foot">
          <div class="drawer-subtotal">
            <span>Subtotal</span><strong>RM 24.00</strong>
          </div>
          <p>Shipping and taxes calculated at checkout.</p>
          <a class="drawer-checkout" href="../checkout/index.html"
            >Proceed to checkout</a
          >
        </div>
      </aside>
    </main>
    <script src="../_assets/c102-v2.js?v=renderer-exact-3"></script>
  </body>
</html>
