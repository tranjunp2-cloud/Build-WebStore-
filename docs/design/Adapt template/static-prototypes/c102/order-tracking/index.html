<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Track order — GlowBeauty</title>
    <link rel="stylesheet" href="../_assets/c102-v2.css?v=renderer-exact-3" />
  </head>
  <body data-no-announcement>
    <a class="skip" href="#main">Skip to content</a>
    <header
      data-cart-background
      class="nav"
      data-block-type="navigation"
      data-block-variant="centered"
      data-mapping-status="approximation"
    >
      <div class="nav-inner">
        <a class="brand" href="../index.html">GlowBeauty</a>
        <nav class="nav-links" data-nav-links aria-label="Primary"><a href="../index.html">Home</a><a href="../products/index.html">Products</a><a href="../articles/index.html">Articles</a><a href="../contact/index.html">Contact</a><a aria-current="page" href="index.html">Order Tracking</a></nav>
        <button
          class="menu-btn"
          data-menu-button
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          Menu
        </button>
      </div>
    </header>
    <main
      id="main"
      data-cart-background
      class="order-lookup-page"
      data-runtime-component="OrderLookupClient"
      data-mapping-status="runtime"
    >
      <section class="order-lookup-card">
        <div class="order-package-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5zM4 7.5l8 4.5 8-4.5M12 12v9"
            />
          </svg>
        </div>
        <div class="order-lookup-title">
          <h1>Track your order</h1>
          <p>Enter your order number to see the latest delivery status.</p>
        </div>
        <form data-order-lookup novalidate>
          <label for="order-number">Order number</label
          ><input
            id="order-number"
            name="orderNumber"
            type="text"
            placeholder="e.g. PW-1024"
            autocomplete="off"
            autofocus
            aria-describedby="order-error"
          />
          <p id="order-error" class="field-error" role="alert"></p>
          <button type="submit">
            Track order <span aria-hidden="true">→</span>
          </button>
        </form>
        <p class="order-back"><a href="../index.html">← GlowBeauty</a></p>
      </section>
    </main>
    <script src="../_assets/c102-v2.js?v=renderer-exact-3"></script>
  </body>
</html>
