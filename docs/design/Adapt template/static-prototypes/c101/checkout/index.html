<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout — BeautyStore</title>
    <link rel="stylesheet" href="../_v2.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to checkout</a>
    <main
      id="main"
      class="v2-checkout-page"
      data-runtime-owner="CheckoutClient standalone shell"
      data-mapping-status="runtime-mirror"
    >
      <header class="v2-checkout-head">
        <div class="v2-container v2-checkout-head-row">
          <a href="../cart/index.html">← Back</a>
          <div>
            <strong>Checkout</strong>
            <div class="v2-checkout-progress">
              Cart › Checkout › Confirmation
            </div>
          </div>
          <span class="v2-secure">🔒 Secure checkout</span>
        </div>
      </header>
      <div class="v2-container v2-checkout-shell">
        <form class="v2-form" data-demo-form>
          <section class="v2-checkout-card">
            <div class="v2-checkout-card-title">
              <span>01</span>
              <h2>Contact information</h2>
            </div>
            <div class="form-grid">
              <div class="v2-field field full">
                <label for="ck-email">Email address</label
                ><input id="ck-email" type="email" autocomplete="email" />
              </div>
              <div class="v2-field">
                <label for="ck-first">First name</label
                ><input id="ck-first" autocomplete="given-name" />
              </div>
              <div class="v2-field">
                <label for="ck-last">Last name</label
                ><input id="ck-last" autocomplete="family-name" />
              </div>
              <div class="v2-field field full">
                <label for="ck-address">Address</label
                ><input id="ck-address" autocomplete="street-address" />
              </div>
              <div class="v2-field">
                <label for="ck-city">City</label
                ><input id="ck-city" autocomplete="address-level2" />
              </div>
              <div class="v2-field">
                <label for="ck-postcode">Postcode</label
                ><input id="ck-postcode" autocomplete="postal-code" />
              </div>
            </div>
          </section>
          <section class="v2-checkout-card">
            <div class="v2-checkout-card-title">
              <span>02</span>
              <h2>Shipping method</h2>
            </div>
            <label
              class="notice"
              style="display: flex; align-items: center; gap: 0.75rem"
              ><input type="radio" name="shipping" checked />Standard delivery
              <strong style="margin-left: auto">RM 8</strong></label
            >
          </section>
          <section class="v2-checkout-card">
            <div class="v2-checkout-card-title">
              <span>03</span>
              <h2>Payment</h2>
            </div>
            <label
              class="notice"
              style="display: flex; align-items: center; gap: 0.75rem"
              ><input type="radio" name="payment" checked />Cash on
              delivery</label
            >
            <p class="muted" style="margin-top: 1rem">
              Static review state; no payment or order logic runs here.
            </p>
          </section>
        </form>
        <aside class="v2-checkout-card v2-checkout-summary">
          <h2>Order summary</h2>
          <div class="v2-cart-item">
            <img
              src="../_assets/314d1255f38d-edYe9kOexcMRTMJK5XI4ERPoVHEM9etLof8PU8knj0o.webp"
              alt="Coco Cocoa Creme Body Butter"
            />
            <div>
              <strong>Coco Cocoa Creme Body Butter</strong>
              <p class="muted">Qty 1</p>
              <strong>RM 129</strong>
            </div>
          </div>
          <div class="order-line">
            <span>Subtotal</span><strong>RM 129</strong>
          </div>
          <div class="order-line">
            <span>Shipping</span><strong>RM 8</strong>
          </div>
          <div class="order-line order-total">
            <span>Total</span><strong>RM 137</strong>
          </div>
          <button class="btn" style="width: 100%; margin-top: 1.5rem" disabled>
            Place order (demo)
          </button>
        </aside>
      </div>
    </main>
    <script src="../_v2.js"></script>
  </body>
</html>
