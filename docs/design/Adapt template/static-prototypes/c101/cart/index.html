<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cart drawer mirror — BeautyStore</title>
    <link rel="stylesheet" href="../_v2.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to cart</a>
    <header
      class="site-nav"
      data-block-type="navigation"
      data-block-variant="default"
      data-mapping-status="renderer-mirror"
    >
      <div class="container nav-inner">
        <a class="brand" href="../index.html">BeautyStore</a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a class="nav-link" href="../index.html">Home</a
          ><a class="nav-link" href="../products/index.html">Products</a
          ><a class="nav-link" href="../articles/index.html">Blog</a
          ><a class="nav-link" href="../contact/index.html">Contact</a>
        </nav>
        <a class="btn" href="../products/index.html">Shop now</a>
      </div>
    </header>
    <main
      id="main"
      class="v2-cart-stage"
      data-runtime-owner="CartWidgetBlock + CartDrawer + useCartStore"
      data-mapping-status="runtime-mirror"
    >
      <aside class="v2-cart-panel" aria-label="Shopping cart drawer">
        <div class="v2-cart-head">
          <div class="v2-cart-title">
            <span aria-hidden="true">🛒</span>
            <div>
              <h1>Your cart <span style="opacity: 0.4">(1)</span></h1>
              <p>Review your selection</p>
            </div>
          </div>
          <a class="icon" href="../index.html" aria-label="Close cart mirror"
            >×</a
          >
        </div>
        <div class="v2-cart-items" aria-live="polite">
          <article class="v2-cart-item">
            <img
              src="../_assets/314d1255f38d-edYe9kOexcMRTMJK5XI4ERPoVHEM9etLof8PU8knj0o.webp"
              alt="Coco Cocoa Creme Body Butter"
            />
            <div class="v2-cart-item-info">
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  gap: 0.75rem;
                "
              >
                <div>
                  <h2>Coco Cocoa Creme Body Butter</h2>
                  <p class="muted">200ml</p>
                </div>
                <button class="icon" aria-label="Remove item">×</button>
              </div>
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  margin-top: 0.75rem;
                "
              >
                <div class="v2-qty">
                  <button aria-label="Decrease">−</button><strong>1</strong
                  ><button aria-label="Increase">+</button>
                </div>
                <strong>RM 129</strong>
              </div>
            </div>
          </article>
        </div>
        <div class="v2-cart-foot">
          <div class="order-line">
            <span>Subtotal</span><strong>RM 129</strong>
          </div>
          <p class="muted" style="font-size: 0.75rem">
            Shipping and taxes calculated at checkout.
          </p>
          <a
            class="btn"
            style="width: 100%; height: 54px"
            href="../checkout/index.html"
            >Checkout</a
          ><a
            class="btn outline"
            style="width: 100%; margin-top: 0.75rem"
            href="../products/index.html"
            >Continue shopping</a
          >
          <p class="notice" style="margin-top: 1rem">
            Static, non-stateful mirror of the existing runtime drawer.
          </p>
        </div>
      </aside>
    </main>
  </body>
</html>
