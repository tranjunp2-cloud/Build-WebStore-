# ── PrimeWeb — Docker Compose (Production) ───────────────────────────────
# Deploy lên server: docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────

services:
  # ── Next.js + Payload CMS App ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URI=postgresql://primeweb:${DB_PASSWORD}@postgres:5432/primeweb
        - PAYLOAD_SECRET=${PAYLOAD_SECRET}
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
        - NEXT_PUBLIC_PLATFORM_DOMAIN=${NEXT_PUBLIC_PLATFORM_DOMAIN}
    container_name: primeweb-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URI=postgresql://primeweb:${DB_PASSWORD}@postgres:5432/primeweb
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
      - NEXT_PUBLIC_PLATFORM_DOMAIN=${NEXT_PUBLIC_PLATFORM_DOMAIN}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-primeweb-media}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION:-ap-southeast-1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - primeweb-net

  # ── PostgreSQL Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: primeweb-db
    environment:
      POSTGRES_DB: primeweb
      POSTGRES_USER: primeweb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primeweb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - primeweb-net
    # KHÔNG expose port ra ngoài trong production (chỉ internal)

  # ── MinIO (S3-compatible Object Storage) ───────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: primeweb-storage
    ports:
      - "9001:9001"    # Console UI (internal access only)
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - primeweb-net

  # ── MinIO Bucket Setup (runs once) ────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: primeweb-storage-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb myminio/${S3_BUCKET:-primeweb-media} --ignore-existing;
        mc anonymous set public myminio/${S3_BUCKET:-primeweb-media};
        echo 'Bucket ready';
      "
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
    networks:
      - primeweb-net

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  primeweb-net:
    driver: bridge
